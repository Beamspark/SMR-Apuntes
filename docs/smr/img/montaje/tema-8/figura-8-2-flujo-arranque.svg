<svg viewBox="0 0 940 260" width="100%" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#1e1e24" rx="10"/>

  <defs>
    <marker id="arr-flow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#29b6f6"/>
    </marker>
  </defs>

  <text x="470" y="34" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">FLUJO SECUENCIAL DEL PROCESO DE ARRANQUE DEL SISTEMA</text>

  <!-- Bloque 1: Encendido -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="180" height="70" rx="6" fill="#2d2d38" stroke="#29b6f6" stroke-width="1.5"/>
    <text x="90" y="28" fill="#29b6f6" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Encendido (PC)</text>
    <text x="90" y="48" fill="#cfd8dc" font-family="sans-serif" font-size="10" text-anchor="middle">Líneas y raíles PSU</text>
  </g>
  <line x1="210" y1="95" x2="245" y2="95" stroke="#29b6f6" stroke-width="2.5" marker-end="url(#arr-flow)"/>

  <!-- Bloque 2: POST y Firmware -->
  <g transform="translate(255, 60)">
    <rect x="0" y="0" width="180" height="70" rx="6" fill="#2d2d38" stroke="#ab47bc" stroke-width="1.5"/>
    <text x="90" y="28" fill="#ab47bc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Rutina POST</text>
    <text x="90" y="48" fill="#cfd8dc" font-family="sans-serif" font-size="10" text-anchor="middle">Firmware BIOS / UEFI</text>
  </g>
  <line x1="435" y1="95" x2="470" y2="95" stroke="#29b6f6" stroke-width="2.5" marker-end="url(#arr-flow)"/>

  <!-- Bloque 3: Bootstrap Loader -->
  <g transform="translate(480, 60)">
    <rect x="0" y="0" width="190" height="70" rx="6" fill="#2d2d38" stroke="#29b6f6" stroke-width="1.5"/>
    <text x="95" y="28" fill="#29b6f6" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Bootstrap Loader</text>
    <text x="95" y="48" fill="#cfd8dc" font-family="sans-serif" font-size="10" text-anchor="middle">Lectura MBR / GPT</text>
  </g>
  <line x1="670" y1="95" x2="705" y2="95" stroke="#29b6f6" stroke-width="2.5" marker-end="url(#arr-flow)"/>

  <!-- Bloque 4: Gestor de Arranque -->
  <g transform="translate(715, 60)">
    <rect x="0" y="0" width="195" height="70" rx="6" fill="#2d2d38" stroke="#ab47bc" stroke-width="1.5"/>
    <text x="97" y="28" fill="#ab47bc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Gestor de Arranque</text>
    <text x="97" y="48" fill="#cfd8dc" font-family="sans-serif" font-size="10" text-anchor="middle">bootmgr / GRUB2</text>
  </g>

  <!-- Flecha descendente hacia el Kernel -->
  <path d="M 812 130 L 812 155 L 485 155 L 485 170" fill="none" stroke="#29b6f6" stroke-width="2.5" marker-end="url(#arr-flow)"/>

  <!-- Bloque 5: Kernel del OS -->
  <g transform="translate(375, 175)">
    <rect x="0" y="0" width="220" height="65" rx="6" fill="#2d2d38" stroke="#ab47bc" stroke-width="2"/>
    <text x="110" y="28" fill="#ab47bc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Kernel del OS</text>
    <text x="110" y="48" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">Windows / Linux (Modo Núcleo)</text>
  </g>
</svg>
