<svg viewBox="0 0 960 280" width="100%" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#1e1e24" rx="10"/>

  <defs>
    <marker id="arr-blue-8" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#29b6f6"/>
    </marker>
  </defs>

  <text x="480" y="34" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">SECUENCIA DE PUESTA EN MARCHA: DE LA ENERGIZACIÓN AL SISTEMA OPERATIVO</text>

  <!-- Paso 1 -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="195" height="85" rx="6" fill="#2d2d38" stroke="#29b6f6" stroke-width="1.5"/>
    <text x="97" y="24" fill="#29b6f6" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">1. Energización</text>
    <text x="97" y="46" fill="#cfd8dc" font-family="sans-serif" font-size="10" text-anchor="middle">Interruptor PSU (I) + Power_sw</text>
    <text x="97" y="64" fill="#888888" font-family="sans-serif" font-size="9" text-anchor="middle">Giro ventiladores y LEDs</text>
  </g>
  <line x1="230" y1="102" x2="255" y2="102" stroke="#29b6f6" stroke-width="2.5" marker-end="url(#arr-blue-8)"/>

  <!-- Paso 2 -->
  <g transform="translate(265, 60)">
    <rect x="0" y="0" width="195" height="85" rx="6" fill="#2d2d38" stroke="#ab47bc" stroke-width="1.5"/>
    <text x="97" y="24" fill="#ab47bc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">2. Rutina POST</text>
    <text x="97" y="46" fill="#cfd8dc" font-family="sans-serif" font-size="10" text-anchor="middle">Test de CPU, RAM y gráfica</text>
    <text x="97" y="64" fill="#888888" font-family="sans-serif" font-size="9" text-anchor="middle">Pitido de confirmación</text>
  </g>
  <line x1="465" y1="102" x2="490" y2="102" stroke="#29b6f6" stroke-width="2.5" marker-end="url(#arr-blue-8)"/>

  <!-- Paso 3 -->
  <g transform="translate(500, 60)">
    <rect x="0" y="0" width="195" height="85" rx="6" fill="#2d2d38" stroke="#29b6f6" stroke-width="1.5"/>
    <text x="97" y="24" fill="#29b6f6" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">3. Firmware Setup</text>
    <text x="97" y="46" fill="#cfd8dc" font-family="sans-serif" font-size="10" text-anchor="middle">BIOS / UEFI (DEL / F2)</text>
    <text x="97" y="64" fill="#888888" font-family="sans-serif" font-size="9" text-anchor="middle">Ajuste CMOS y orden Boot</text>
  </g>
  <line x1="700" y1="102" x2="725" y2="102" stroke="#29b6f6" stroke-width="2.5" marker-end="url(#arr-blue-8)"/>

  <!-- Paso 4 -->
  <g transform="translate(735, 60)">
    <rect x="0" y="0" width="195" height="85" rx="6" fill="#2d2d38" stroke="#ab47bc" stroke-width="1.5"/>
    <text x="97" y="24" fill="#ab47bc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">4. Bootstrap Loader</text>
    <text x="97" y="46" fill="#cfd8dc" font-family="sans-serif" font-size="10" text-anchor="middle">Lectura del primer sector</text>
    <text x="97" y="64" fill="#888888" font-family="sans-serif" font-size="9" text-anchor="middle">Esquema MBR o tabla GPT</text>
  </g>

  <!-- Salto hacia la carga del Bootloader -->
  <path d="M 832 150 L 832 175 L 362 175 L 362 185" fill="none" stroke="#29b6f6" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Paso 5: Bifurcación Gestores de Arranque -->
  <g transform="translate(265, 190)">
    <rect x="0" y="0" width="195" height="75" rx="6" fill="#2d2d38" stroke="#29b6f6" stroke-width="1.5"/>
    <text x="97" y="24" fill="#29b6f6" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">5. Boot Manager</text>
    <text x="97" y="44" fill="#cfd8dc" font-family="sans-serif" font-size="10" text-anchor="middle">GRUB / Win Boot Manager</text>
    <text x="97" y="60" fill="#888888" font-family="sans-serif" font-size="9" text-anchor="middle">Menú de selección de OS</text>
  </g>
  <line x1="465" y1="227" x2="490" y2="227" stroke="#29b6f6" stroke-width="2.5" marker-end="url(#arr-blue-8)"/>

  <!-- Paso 6: Kernel del Sistema Operativo -->
  <g transform="translate(500, 190)">
    <rect x="0" y="0" width="195" height="75" rx="6" fill="#2d2d38" stroke="#ab47bc" stroke-width="1.5"/>
    <text x="97" y="24" fill="#ab47bc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">6. Carga de Kernel</text>
    <text x="97" y="44" fill="#cfd8dc" font-family="sans-serif" font-size="10" text-anchor="middle">Controladores y servicios</text>
    <text x="97" y="60" fill="#888888" font-family="sans-serif" font-size="9" text-anchor="middle">Acceso a entorno de usuario</text>
  </g>
</svg>
