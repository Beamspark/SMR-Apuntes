<svg viewBox="0 0 920 380" width="100%" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#1e1e24" rx="10"/>

  <defs>
    <marker id="arr-flow-cool" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#29b6f6"/>
    </marker>
    <marker id="arr-flow-hot" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef5350"/>
    </marker>
  </defs>

  <text x="460" y="34" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">CIRCUITO CERRADO DE REFRIGERACIÓN LÍQUIDA (SISTEMA ALL-IN-ONE / AIO)</text>

  <!-- Bloque CPU / Bloque de agua y bomba integrada -->
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="180" height="150" rx="8" fill="#2d2d38" stroke="#ab47bc" stroke-width="2"/>
    <text x="90" y="28" fill="#ab47bc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">BLOQUE DE AGUA + BOMBA</text>
    <rect x="25" y="42" width="130" height="42" rx="4" fill="#1e1e24" stroke="#444455"/>
    <text x="90" y="67" fill="#cfd8dc" font-family="sans-serif" font-size="11" text-anchor="middle">Bomba de Impulsión</text>
    <!-- Base de cobre (Cold plate) -->
    <rect x="20" y="105" width="140" height="15" rx="2" fill="#d97706"/>
    <text x="90" y="117" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Placa de Cobre (Cold Plate)</text>
    <!-- CPU subyacente -->
    <rect x="35" y="125" width="110" height="12" rx="2" fill="#37474f"/>
    <text x="90" y="134" fill="#cfd8dc" font-family="sans-serif" font-size="8" text-anchor="middle">Microprocesador (IHS)</text>
  </g>

  <!-- Tuberías flexibles -->
  <!-- Tubo caliente: Bomba a Radiador -->
  <path d="M 280 180 C 400 180, 480 110, 620 110" fill="none" stroke="#ef5350" stroke-width="12" stroke-linecap="round"/>
  <path d="M 280 180 C 400 180, 480 110, 620 110" fill="none" stroke="#1e1e24" stroke-width="4" stroke-linecap="round"/>
  <line x1="430" y1="135" x2="460" y2="125" stroke="#ef5350" stroke-width="2.5" marker-end="url(#arr-flow-hot)"/>
  <text x="445" y="110" fill="#ef5350" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Líquido Caliente hacia Radiador</text>

  <!-- Tubo frío: Radiador a Bomba -->
  <path d="M 620 250 C 480 250, 400 230, 280 230" fill="none" stroke="#29b6f6" stroke-width="12" stroke-linecap="round"/>
  <path d="M 620 250 C 480 250, 400 230, 280 230" fill="none" stroke="#1e1e24" stroke-width="4" stroke-linecap="round"/>
  <line x1="460" y1="245" x2="430" y2="240" stroke="#29b6f6" stroke-width="2.5" marker-end="url(#arr-flow-cool)"/>
  <text x="445" y="275" fill="#29b6f6" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Líquido Refrigerado de Retorno</text>

  <!-- Radiador con aletas y ventiladores -->
  <g transform="translate(620, 80)">
    <!-- Cuerpo del Radiador -->
    <rect x="0" y="0" width="70" height="230" rx="4" fill="#37474f" stroke="#78909c" stroke-width="2"/>
    <text x="35" y="118" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" transform="rotate(-90 35 118)">RADIADOR (ALETAS)</text>
    <!-- Ventiladores adosados -->
    <rect x="75" y="10" width="45" height="100" rx="4" fill="#2d2d38" stroke="#29b6f6" stroke-width="1.5"/>
    <circle cx="97" cy="60" r="16" fill="#1e1e24" stroke="#29b6f6"/>
    <text x="97" y="64" fill="#29b6f6" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">FAN 1</text>

    <rect x="75" y="120" width="45" height="100" rx="4" fill="#2d2d38" stroke="#29b6f6" stroke-width="1.5"/>
    <circle cx="97" cy="170" r="16" fill="#1e1e24" stroke="#29b6f6"/>
    <text x="97" y="174" fill="#29b6f6" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">FAN 2</text>

    <!-- Flechas de expulsión de aire caliente al exterior -->
    <line x1="125" y1="60" x2="185" y2="60" stroke="#ef5350" stroke-width="3" marker-end="url(#arr-flow-hot)"/>
    <line x1="125" y1="170" x2="185" y2="170" stroke="#ef5350" stroke-width="3" marker-end="url(#arr-flow-hot)"/>
    <text x="170" y="120" fill="#ef5350" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Disipación de Calor al Exterior</text>
  </g>
</svg>
