<svg viewBox="0 0 940 380" width="100%" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#1e1e24" rx="10"/>

  <defs>
    <marker id="arr-diag" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#29b6f6"/>
    </marker>
    <marker id="arr-fail" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef5350"/>
    </marker>
  </defs>

  <text x="470" y="34" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">PROTOCOLO DE DIAGNÓSTICO POR DESCARTE (CONFIGURACIÓN MÍNIMA ESENCIAL)</text>

  <!-- Paso 1: Síntoma Inicial -->
  <g transform="translate(30, 65)">
    <rect x="0" y="0" width="170" height="75" rx="6" fill="#2d2d38" stroke="#ef5350" stroke-width="1.5"/>
    <text x="85" y="26" fill="#ef5350" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">1. Avería Crítica</text>
    <text x="85" y="44" fill="#cfd8dc" font-family="sans-serif" font-size="10" text-anchor="middle">No enciende / Sin señal</text>
    <text x="85" y="60" fill="#888888" font-family="sans-serif" font-size="9" text-anchor="middle">Recopilar síntomas</text>
  </g>
  <line x1="200" y1="102" x2="235" y2="102" stroke="#29b6f6" stroke-width="2.5" marker-end="url(#arr-diag)"/>

  <!-- Paso 2: Aislamiento / Desconexión -->
  <g transform="translate(245, 65)">
    <rect x="0" y="0" width="190" height="75" rx="6" fill="#2d2d38" stroke="#29b6f6" stroke-width="1.5"/>
    <text x="95" y="26" fill="#29b6f6" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">2. Desconexión Total</text>
    <text x="95" y="44" fill="#cfd8dc" font-family="sans-serif" font-size="10" text-anchor="middle">Retirar GPU, discos, USB</text>
    <text x="95" y="60" fill="#888888" font-family="sans-serif" font-size="9" text-anchor="middle">Aislar la placa base</text>
  </g>
  <line x1="435" y1="102" x2="470" y2="102" stroke="#29b6f6" stroke-width="2.5" marker-end="url(#arr-diag)"/>

  <!-- Paso 3: Configuración Mínima -->
  <g transform="translate(480, 55)">
    <rect x="0" y="0" width="205" height="95" rx="6" fill="#2d2d38" stroke="#ab47bc" stroke-width="2"/>
    <text x="102" y="24" fill="#ab47bc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">3. BANCO MÍNIMO</text>
    <text x="102" y="42" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">• Placa base + PSU</text>
    <text x="102" y="58" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">• CPU + Disipador (FAN)</text>
    <text x="102" y="74" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">• 1 Módulo RAM + Speaker</text>
  </g>
  <line x1="685" y1="102" x2="720" y2="102" stroke="#29b6f6" stroke-width="2.5" marker-end="url(#arr-diag)"/>

  <!-- Paso 4: Prueba POST -->
  <g transform="translate(730, 65)">
    <rect x="0" y="0" width="180" height="75" rx="6" fill="#2d2d38" stroke="#29b6f6" stroke-width="1.5"/>
    <text x="90" y="26" fill="#29b6f6" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">4. Test de Arranque</text>
    <text x="90" y="44" fill="#cfd8dc" font-family="sans-serif" font-size="10" text-anchor="middle">¿Emite pitido o POST?</text>
    <text x="90" y="60" fill="#888888" font-family="sans-serif" font-size="9" text-anchor="middle">Verificar Debug LEDs</text>
  </g>

  <!-- Bifurcación hacia abajo -->
  <!-- Camino NO arranca (Avería en núcleo) -->
  <path d="M 820 140 L 820 220 L 685 220" fill="none" stroke="#ef5350" stroke-width="2.5" marker-end="url(#arr-fail)"/>
  <text x="760" y="212" fill="#ef5350" font-family="sans-serif" font-size="10" font-weight="bold">NO ARRANCE</text>

  <g transform="translate(430, 185)">
    <rect x="0" y="0" width="245" height="70" rx="6" fill="#2d2d38" stroke="#ef5350" stroke-width="1.5"/>
    <text x="122" y="24" fill="#ef5350" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Fallo en Núcleo Básico</text>
    <text x="122" y="42" fill="#cfd8dc" font-family="sans-serif" font-size="9" text-anchor="middle">Comprobar voltajes PSU con polímetro,</text>
    <text x="122" y="56" fill="#cfd8dc" font-family="sans-serif" font-size="9" text-anchor="middle">cambiar slot de RAM o prueba cruzada de CPU.</text>
  </g>

  <!-- Camino SÍ arranca (Conexión paso a paso) -->
  <path d="M 820 140 L 820 310 L 390 310" fill="none" stroke="#29b6f6" stroke-width="2.5" marker-end="url(#arr-diag)"/>
  <text x="760" y="302" fill="#29b6f6" font-family="sans-serif" font-size="10" font-weight="bold">SÍ ARRANCA</text>

  <g transform="translate(130, 275)">
    <rect x="0" y="0" width="250" height="70" rx="6" fill="#2d2d38" stroke="#29b6f6" stroke-width="1.5"/>
    <text x="125" y="24" fill="#29b6f6" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Reconexión Progresiva</text>
    <text x="125" y="42" fill="#cfd8dc" font-family="sans-serif" font-size="9" text-anchor="middle">Conectar 1 componente cada vez (GPU, SSD...).</text>
    <text x="125" y="56" fill="#cfd8dc" font-family="sans-serif" font-size="9" text-anchor="middle">El elemento que impida el POST es el defectuoso.</text>
  </g>
</svg>
