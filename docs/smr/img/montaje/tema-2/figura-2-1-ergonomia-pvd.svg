<svg viewBox="0 0 850 400" width="100%" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#1e1e24" rx="10"/>

  <text x="425" y="36" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">CRITERIOS ERGONÓMICOS EN PUESTOS INFORMÁTICOS (PVD)</text>

  <!-- Monitor y Soporte -->
  <rect x="130" y="110" width="16" height="130" rx="3" fill="#29b6f6"/>
  <rect x="110" y="240" width="60" height="12" rx="2" fill="#444444"/>
  <rect x="134" y="220" width="10" height="25" fill="#444444"/>

  <!-- Mesa de trabajo -->
  <rect x="80" y="245" width="280" height="14" rx="2" fill="#2d2d38" stroke="#444444" stroke-width="1.5"/>
  <line x1="120" y1="259" x2="120" y2="360" stroke="#444444" stroke-width="6"/>

  <!-- Teclado y ratón -->
  <rect x="180" y="238" width="45" height="7" rx="2" fill="#ab47bc"/>
  <rect x="235" y="239" width="15" height="6" rx="2" fill="#29b6f6"/>

  <!-- Usuario esquemático -->
  <!-- Cabeza -->
  <circle cx="340" cy="115" r="22" fill="#29b6f6"/>
  <!-- Tronco / Espalda -->
  <line x1="340" y1="137" x2="340" y2="255" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <!-- Brazo / Codo 90º -->
  <polyline points="340,165 305,215 220,240" fill="none" stroke="#29b6f6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Muslos / Piernas 90º -->
  <polyline points="340,255 270,255 270,345" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Pies planos -->
  <line x1="250" y1="345" x2="295" y2="345" stroke="#ab47bc" stroke-width="6" stroke-linecap="round"/>

  <!-- Silla ergonómica -->
  <rect x="315" y="250" width="65" height="10" rx="2" fill="#ab47bc"/>
  <line x1="355" y1="160" x2="355" y2="250" stroke="#ab47bc" stroke-width="8" stroke-linecap="round"/>
  <line x1="345" y1="260" x2="345" y2="320" stroke="#444444" stroke-width="6"/>
  <line x1="320" y1="320" x2="370" y2="320" stroke="#444444" stroke-width="4"/>

  <!-- Línea de visión directa al tercio superior -->
  <line x1="330" y1="115" x2="146" y2="120" stroke="#29b6f6" stroke-width="2" stroke-dasharray="5 3"/>
  <circle cx="146" cy="120" r="4" fill="#29b6f6"/>

  <!-- Cartelas informativas -->
  <!-- 1. Mirada -->
  <g transform="translate(430, 85)">
    <rect x="0" y="0" width="370" height="42" rx="6" fill="#2d2d38" stroke="#29b6f6" stroke-width="1.5"/>
    <text x="15" y="19" fill="#29b6f6" font-family="sans-serif" font-size="12" font-weight="bold">1. Altura de pantalla</text>
    <text x="15" y="33" fill="#ffffff" font-family="sans-serif" font-size="11">Borde superior a la altura de los ojos (distancia: 50-70 cm).</text>
  </g>

  <!-- 2. Codos y brazos -->
  <g transform="translate(430, 145)">
    <rect x="0" y="0" width="370" height="42" rx="6" fill="#2d2d38" stroke="#ab47bc" stroke-width="1.5"/>
    <text x="15" y="19" fill="#ab47bc" font-family="sans-serif" font-size="12" font-weight="bold">2. Extremidades superiores</text>
    <text x="15" y="33" fill="#ffffff" font-family="sans-serif" font-size="11">Brazos y antebrazos formando un ángulo aproximado de 90°.</text>
  </g>

  <!-- 3. Columna / Espalda -->
  <g transform="translate(430, 205)">
    <rect x="0" y="0" width="370" height="42" rx="6" fill="#2d2d38" stroke="#29b6f6" stroke-width="1.5"/>
    <text x="15" y="19" fill="#29b6f6" font-family="sans-serif" font-size="12" font-weight="bold">3. Soporte lumbar</text>
    <text x="15" y="33" fill="#ffffff" font-family="sans-serif" font-size="11">Espalda vertical apoyada en el respaldo lumbar sin giros bruscos.</text>
  </g>

  <!-- 4. Piernas y pies -->
  <g transform="translate(430, 265)">
    <rect x="0" y="0" width="370" height="42" rx="6" fill="#2d2d38" stroke="#ab47bc" stroke-width="1.5"/>
    <text x="15" y="19" fill="#ab47bc" font-family="sans-serif" font-size="12" font-weight="bold">4. Rodillas y pies</text>
    <text x="15" y="33" fill="#ffffff" font-family="sans-serif" font-size="11">Muslos horizontales a 90° y pies apoyados planos o reposapiés.</text>
  </g>

  <!-- Base suelo -->
  <line x1="50" y1="360" x2="800" y2="360" stroke="#33333e" stroke-width="2"/>
</svg>
