<svg viewBox="0 0 940 380" width="100%" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#1e1e24" rx="10"/>

  <text x="470" y="34" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">ARQUITECTURA DE ESQUEMAS DE PARTICIONADO: MBR FRENTE A GPT (UEFI)</text>

  <!-- Bloque 1: Esquema MBR Tradicional -->
  <g transform="translate(40, 65)">
    <rect x="0" y="0" width="860" height="135" rx="6" fill="#2d2d38" stroke="#ef5350" stroke-width="1.5"/>
    <text x="20" y="25" fill="#ef5350" font-family="sans-serif" font-size="12" font-weight="bold">ESQUEMA TRADICIONAL MBR (BIOS) — Límite de 4 particiones primarias / máx. 2 TB</text>

    <!-- Pistas de MBR -->
    <g transform="translate(20, 40)">
      <!-- Sector MBR -->
      <rect x="0" y="0" width="100" height="70" rx="3" fill="#1e1e24" stroke="#ffffff" stroke-dasharray="3 2"/>
      <text x="50" y="30" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Sector MBR</text>
      <text x="50" y="48" fill="#888888" font-family="sans-serif" font-size="8" text-anchor="middle">512 Bytes / Boot</text>

      <!-- Partición Primaria 1 -->
      <rect x="110" y="0" width="180" height="70" rx="3" fill="#263238" stroke="#29b6f6" stroke-width="1.5"/>
      <text x="200" y="30" fill="#29b6f6" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Partición Primaria 1</text>
      <text x="200" y="48" fill="#cfd8dc" font-family="sans-serif" font-size="9" text-anchor="middle">Sistema Operativo (Boot)</text>

      <!-- Partición Primaria 2 -->
      <rect x="300" y="0" width="180" height="70" rx="3" fill="#263238" stroke="#29b6f6" stroke-width="1.5"/>
      <text x="390" y="30" fill="#29b6f6" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Partición Primaria 2</text>
      <text x="390" y="48" fill="#cfd8dc" font-family="sans-serif" font-size="9" text-anchor="middle">Almacenamiento / Datos</text>

      <!-- Partición Extendida -->
      <rect x="490" y="0" width="330" height="70" rx="3" fill="#1b1b22" stroke="#ab47bc" stroke-width="1.5"/>
      <text x="655" y="18" fill="#ab47bc" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Partición Extendida (Contenedor)</text>

      <!-- Unidades Lógicas dentro de la extendida -->
      <rect x="500" y="24" width="150" height="40" rx="2" fill="#2d2d38" stroke="#ab47bc"/>
      <text x="575" y="48" fill="#ffffff" font-family="sans-serif" font-size="9" text-anchor="middle">Unidad Lógica 1</text>

      <rect x="660" y="24" width="150" height="40" rx="2" fill="#2d2d38" stroke="#ab47bc"/>
      <text x="735" y="48" fill="#ffffff" font-family="sans-serif" font-size="9" text-anchor="middle">Unidad Lógica 2</text>
    </g>
  </g>
