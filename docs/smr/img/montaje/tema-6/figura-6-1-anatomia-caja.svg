<svg viewBox="0 0 900 480" width="100%" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#1e1e24" rx="10"/>

  <text x="450" y="38" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">ANATOMÍA ESTRUCTURAL DE UNA CAJA DE PC (CHASIS TIPO SEMITORRE)</text>

  <!-- Contorno principal de la caja (chasis) -->
  <rect x="220" y="70" width="460" height="370" rx="8" fill="#262630" stroke="#444455" stroke-width="2"/>

  <!-- Panel Frontal (Izquierda del esquema) -->
  <rect x="220" y="70" width="70" height="370" rx="4" fill="#1f1f27" stroke="#29b6f6" stroke-width="1.5"/>
  <text x="255" y="105" fill="#29b6f6" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">PANEL</text>
  <text x="255" y="118" fill="#29b6f6" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">FRONTAL</text>

  <!-- Botones y conectores frontales -->
  <circle cx="255" cy="145" r="7" fill="#ab47bc"/>
  <text x="255" y="165" fill="#ffffff" font-family="sans-serif" font-size="8" text-anchor="middle">PWR</text>
  <circle cx="255" cy="180" r="4" fill="#29b6f6"/>
  <rect x="247" y="195" width="16" height="5" rx="1" fill="#cfd8dc"/>
  <rect x="247" y="205" width="16" height="5" rx="1" fill="#cfd8dc"/>
  <text x="255" y="222" fill="#888888" font-family="sans-serif" font-size="8" text-anchor="middle">USB</text>

  <!-- Bahías externas frontales 5.25" -->
  <rect x="230" y="240" width="50" height="28" rx="2" fill="#2d2d38" stroke="#555566"/>
  <rect x="230" y="275" width="50" height="28" rx="2" fill="#2d2d38" stroke="#555566"/>
  <text x="255" y="320" fill="#888888" font-family="sans-serif" font-size="8" text-anchor="middle">5.25" / ODD</text>

  <!-- Bahías internas 3.5" / 2.5" (Drive Bays) -->
  <g transform="translate(305, 305)">
    <rect x="0" y="0" width="115" height="120" rx="4" fill="#2a2a36" stroke="#29b6f6" stroke-width="1.5"/>
    <rect x="10" y="12" width="95" height="20" rx="2" fill="#383848"/>
    <rect x="10" y="42" width="95" height="20" rx="2" fill="#383848"/>
    <rect x="10" y="72" width="95" height="20" rx="2" fill="#383848"/>
    <text x="57" y="108" fill="#29b6f6" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Bahías 3.5" / 2.5"</text>
  </g>

  <!-- Hueco para la Fuente de Alimentación (PSU Shroud) -->
  <g transform="translate(435, 345)">
    <rect x="0" y="0" width="230" height="80" rx="4" fill="#20202a" stroke="#ab47bc" stroke-width="1.5"/>
    <text x="115" y="38" fill="#ab47bc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Compartimento Fuente (PSU)</text>
    <text x="115" y="55" fill="#cfd8dc" font-family="sans-serif" font-size="10" text-anchor="middle">Toma AC 230V + Ventilador inferior</text>
  </g>

  <!-- Zona de Placa Base (Bandeja / Tray) -->
  <g transform="translate(305, 85)">
    <rect x="0" y="0" width="360" height="210" rx="4" fill="#2d2d3a" stroke="#ffffff" stroke-dasharray="4 3" stroke-width="1"/>
    <text x="180" y="35" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Bandeja de Montaje de Placa Base</text>
    <text x="180" y="55" fill="#888888" font-family="sans-serif" font-size="10" text-anchor="middle">(Taladros para separadores de latón ATX / Micro-ATX / Mini-ITX)</text>

    <!-- Hueco trasero I/O Shield -->
    <rect x="300" y="75" width="50" height="85" rx="2" fill="#1e1e24" stroke="#29b6f6"/>
    <text x="325" y="122" fill="#29b6f6" font-family="sans-serif" font-size="9" text-anchor="middle">I/O Shield</text>

    <!-- Ranuras de Expansión (PCIe slots traseros) -->
    <rect x="300" y="165" width="50" height="40" rx="2" fill="#1e1e24" stroke="#ab47bc"/>
    <line x1="300" y1="175" x2="350" y2="175" stroke="#ab47bc"/>
    <line x1="300" y1="185" x2="350" y2="185" stroke="#ab47bc"/>
    <line x1="300" y1="195" x2="350" y2="195" stroke="#ab47bc"/>
  </g>

  <!-- Rejillas de ventilación y flechas de flujo de aire -->
  <!-- Flujo entrada (Frontal) -->
  <line x1="140" y1="210" x2="210" y2="210" stroke="#29b6f6" stroke-width="3"/>
  <polygon points="215,210 205,205 205,215" fill="#29b6f6"/>
  <text x="175" y="195" fill="#29b6f6" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Aire Frío</text>

  <!-- Flujo salida (Trasero) -->
  <line x1="675" y1="130" x2="745" y2="130" stroke="#ab47bc" stroke-width="3"/>
  <polygon points="750,130 740,125 740,135" fill="#ab47bc"/>
  <text x="715" y="115" fill="#ab47bc" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Aire Caliente</text>

  <!-- Cartelas descriptivas en laterales -->
  <g transform="translate(30, 260)">
    <rect x="0" y="0" width="165" height="46" rx="6" fill="#2d2d38" stroke="#29b6f6" stroke-width="1.5"/>
    <text x="12" y="20" fill="#29b6f6" font-family="sans-serif" font-size="11" font-weight="bold">Panel Frontal</text>
    <text x="12" y="34" fill="#ffffff" font-family="sans-serif" font-size="9">Power, Reset, LEDs, USB</text>
  </g>

  <g transform="translate(710, 240)">
    <rect x="0" y="0" width="165" height="46" rx="6" fill="#2d2d38" stroke="#ab47bc" stroke-width="1.5"/>
    <text x="12" y="20" fill="#ab47bc" font-family="sans-serif" font-size="11" font-weight="bold">Ranuras PCIe</text>
    <text x="12" y="34" fill="#ffffff" font-family="sans-serif" font-size="9">Salidas troqueladas</text>
  </g>
</svg>
