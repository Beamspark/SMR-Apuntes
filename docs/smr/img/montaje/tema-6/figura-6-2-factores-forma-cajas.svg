<svg viewBox="0 0 920 360" width="100%" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#1e1e24" rx="10"/>

  <text x="460" y="36" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">COMPARATIVA DE FORMATOS DE CAJA: TAMAÑO Y ORIENTACIÓN</text>

  <!-- 1. Gran Torre / Semitorre -->
  <g transform="translate(45, 65)">
    <rect x="0" y="0" width="170" height="255" rx="6" fill="#2d2d38" stroke="#29b6f6" stroke-width="2"/>
    <rect x="15" y="20" width="140" height="35" rx="3" fill="#22222b"/>
    <text x="85" y="42" fill="#29b6f6" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Torre / Semitorre</text>
    <rect x="15" y="70" width="140" height="135" rx="3" fill="#1b1b22"/>
    <text x="85" y="130" fill="#cfd8dc" font-family="sans-serif" font-size="11" text-anchor="middle">ATX / E-ATX</text>
    <text x="85" y="148" fill="#888888" font-family="sans-serif" font-size="10" text-anchor="middle">Máxima expansión</text>
    <rect x="15" y="215" width="140" height="25" rx="3" fill="#22222b"/>
    <text x="85" y="232" fill="#29b6f6" font-family="sans-serif" font-size="10" text-anchor="middle">Refrigeración óptima</text>
  </g>

  <!-- 2. Sobremesa (Desktop horizontal) -->
  <g transform="translate(250, 135)">
    <rect x="0" y="0" width="225" height="130" rx="6" fill="#2d2d38" stroke="#ab47bc" stroke-width="2"/>
    <rect x="15" y="15" width="195" height="30" rx="3" fill="#22222b"/>
    <text x="112" y="35" fill="#ab47bc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Sobremesa (Horizontal)</text>
    <rect x="15" y="55" width="195" height="60" rx="3" fill="#1b1b22"/>
    <text x="112" y="85" fill="#cfd8dc" font-family="sans-serif" font-size="11" text-anchor="middle">Micro-ATX / ATX</text>
    <text x="112" y="102" fill="#888888" font-family="sans-serif" font-size="10" text-anchor="middle">Base para monitor / Oficinas</text>
  </g>

  <!-- 3. Mini ITX (Cubo o torre compacta) -->
  <g transform="translate(515, 120)">
    <rect x="0" y="0" width="165" height="165" rx="6" fill="#2d2d38" stroke="#29b6f6" stroke-width="2"/>
    <rect x="15" y="15" width="135" height="30" rx="3" fill="#22222b"/>
    <text x="82" y="35" fill="#29b6f6" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Caja Mini-ITX</text>
    <rect x="15" y="55" width="135" height="95" rx="3" fill="#1b1b22"/>
    <text x="82" y="98" fill="#cfd8dc" font-family="sans-serif" font-size="11" text-anchor="middle">Mini-ITX (17x17 cm)</text>
    <text x="82" y="115" fill="#888888" font-family="sans-serif" font-size="10" text-anchor="middle">Componentes compactos</text>
    <text x="82" y="130" fill="#888888" font-family="sans-serif" font-size="10" text-anchor="middle">Perfil bajo (Low Profile)</text>
  </g>

  <!-- 4. Barebone (Ultra compacto) -->
  <g transform="translate(720, 160)">
    <rect x="0" y="0" width="155" height="105" rx="6" fill="#2d2d38" stroke="#ab47bc" stroke-width="2"/>
    <rect x="12" y="12" width="131" height="26" rx="3" fill="#22222b"/>
    <text x="77" y="29" fill="#ab47bc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Barebone / Mini PC</text>
    <rect x="12" y="45" width="131" height="48" rx="3" fill="#1b1b22"/>
    <text x="77" y="68" fill="#cfd8dc" font-family="sans-serif" font-size="11" text-anchor="middle">Placa + Fuente integradas</text>
    <text x="77" y="83" fill="#888888" font-family="sans-serif" font-size="10" text-anchor="middle">Mínimo volumen (HTPC / POS)</text>
  </g>
</svg>
