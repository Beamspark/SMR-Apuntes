<svg viewBox="0 0 960 260" width="100%" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#1e1e24" rx="10"/>

  <defs>
    <marker id="arr-blue-7" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#29b6f6"/>
    </marker>
  </defs>

  <text x="480" y="34" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">SECUENCIA METODOLÓGICA DE MONTAJE DE UN EQUIPO MICROINFORMÁTICO</text>

  <!-- Fila 1: Pasos 1 a 4 -->
  <!-- Paso 1 -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="195" height="75" rx="6" fill="#2d2d38" stroke="#29b6f6" stroke-width="1.5"/>
    <text x="97" y="24" fill="#29b6f6" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">1. Placa y Chasis</text>
    <text x="97" y="44" fill="#cfd8dc" font-family="sans-serif" font-size="10" text-anchor="middle">I/O Shield + Separadores</text>
    <text x="97" y="60" fill="#888888" font-family="sans-serif" font-size="9" text-anchor="middle">Aislamiento de latón</text>
  </g>
  <line x1="230" y1="92" x2="255" y2="92" stroke="#29b6f6" stroke-width="2.5" marker-end="url(#arr-blue-7)"/>

  <!-- Paso 2 -->
  <g transform="translate(265, 55)">
    <rect x="0" y="0" width="195" height="75" rx="6" fill="#2d2d38" stroke="#ab47bc" stroke-width="1.5"/>
    <text x="97" y="24" fill="#ab47bc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">2. CPU y Zócalo</text>
    <text x="97" y="44" fill="#cfd8dc" font-family="sans-serif" font-size="10" text-anchor="middle">Alineación por marcas</text>
    <text x="97" y="60" fill="#888888" font-family="sans-serif" font-size="9" text-anchor="middle">Cero fuerza de inserción</text>
  </g>
  <line x1="465" y1="92" x2="490" y2="92" stroke="#29b6f6" stroke-width="2.5" marker-end="url(#arr-blue-7)"/>

  <!-- Paso 3 -->
  <g transform="translate(500, 55)">
    <rect x="0" y="0" width="195" height="75" rx="6" fill="#2d2d38" stroke="#29b6f6" stroke-width="1.5"/>
    <text x="97" y="24" fill="#29b6f6" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">3. Disipador Térmico</text>
    <text x="97" y="44" fill="#cfd8dc" font-family="sans-serif" font-size="10" text-anchor="middle">Pasta térmica + CPU_FAN</text>
    <text x="97" y="60" fill="#888888" font-family="sans-serif" font-size="9" text-anchor="middle">Anclaje simétrico</text>
  </g>
  <line x1="700" y1="92" x2="725" y2="92" stroke="#29b6f6" stroke-width="2.5" marker-end="url(#arr-blue-7)"/>

  <!-- Paso 4 -->
  <g transform="translate(735, 55)">
    <rect x="0" y="0" width="195" height="75" rx="6" fill="#2d2d38" stroke="#ab47bc" stroke-width="1.5"/>
    <text x="97" y="24" fill="#ab47bc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">4. Memoria RAM</text>
    <text x="97" y="44" fill="#cfd8dc" font-family="sans-serif" font-size="10" text-anchor="middle">Ranuras DIMM prioritarias</text>
    <text x="97" y="60" fill="#888888" font-family="sans-serif" font-size="9" text-anchor="middle">Presión hasta clic</text>
  </g>

  <!-- Salto de fila -->
  <path d="M 832 135 L 832 155 L 127 155 L 127 165" fill="none" stroke="#29b6f6" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Fila 2: Pasos 5 a 8 -->
  <!-- Paso 5 -->
  <g transform="translate(30, 170)">
    <rect x="0" y="0" width="195" height="75" rx="6" fill="#2d2d38" stroke="#ab47bc" stroke-width="1.5"/>
    <text x="97" y="24" fill="#ab47bc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">5. Fuente y Test POST</text>
    <text x="97" y="44" fill="#cfd8dc" font-family="sans-serif" font-size="10" text-anchor="middle">ATX 24p + EPS 12V</text>
    <text x="97" y="60" fill="#888888" font-family="sans-serif" font-size="9" text-anchor="middle">Comprobación preliminar</text>
  </g>
  <line x1="230" y1="207" x2="255" y2="207" stroke="#29b6f6" stroke-width="2.5" marker-end="url(#arr-blue-7)"/>

  <!-- Paso 6 -->
  <g transform="translate(265, 170)">
    <rect x="0" y="0" width="195" height="75" rx="6" fill="#2d2d38" stroke="#29b6f6" stroke-width="1.5"/>
    <text x="97" y="24" fill="#29b6f6" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">6. Almacenamiento</text>
    <text x="97" y="44" fill="#cfd8dc" font-family="sans-serif" font-size="10" text-anchor="middle">Bahías 2.5" / 3.5" (SATA)</text>
    <text x="97" y="60" fill="#888888" font-family="sans-serif" font-size="9" text-anchor="middle">Datos y alimentación</text>
  </g>
  <line x1="465" y1="207" x2="490" y2="207" stroke="#29b6f6" stroke-width="2.5" marker-end="url(#arr-blue-7)"/>

  <!-- Paso 7 -->
  <g transform="translate(500, 170)">
    <rect x="0" y="0" width="195" height="75" rx="6" fill="#2d2d38" stroke="#ab47bc" stroke-width="1.5"/>
    <text x="97" y="24" fill="#ab47bc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">7. Expansión (GPU)</text>
    <text x="97" y="44" fill="#cfd8dc" font-family="sans-serif" font-size="10" text-anchor="middle">Ranuras PCIe x16</text>
    <text x="97" y="60" fill="#888888" font-family="sans-serif" font-size="9" text-anchor="middle">Pletina y cierre de ranura</text>
  </g>
  <line x1="700" y1="207" x2="725" y2="207" stroke="#29b6f6" stroke-width="2.5" marker-end="url(#arr-blue-7)"/>

  <!-- Paso 8 -->
  <g transform="translate(735, 170)">
    <rect x="0" y="0" width="195" height="75" rx="6" fill="#2d2d38" stroke="#29b6f6" stroke-width="1.5"/>
    <text x="97" y="24" fill="#29b6f6" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">8. F_PANEL y Cierre</text>
    <text x="97" y="44" fill="#cfd8dc" font-family="sans-serif" font-size="10" text-anchor="middle">Power, Reset, LEDs, USB</text>
    <text x="97" y="60" fill="#888888" font-family="sans-serif" font-size="9" text-anchor="middle">Guiado final con bridas</text>
  </g>
</svg>
