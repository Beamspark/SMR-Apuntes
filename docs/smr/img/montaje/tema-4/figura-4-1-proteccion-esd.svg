<svg viewBox="0 0 920 400" width="100%" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#1e1e24" rx="10"/>

  <text x="460" y="36" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">ESTACIÓN DE TRABAJO CON PROTECCIÓN ANTIESTÁTICA (ESD)</text>

  <!-- Banco de Trabajo -->
  <rect x="70" y="240" width="780" height="18" rx="2" fill="#2d2d38" stroke="#444444" stroke-width="1.5"/>
  <rect x="110" y="258" width="22" height="110" fill="#444444"/>
  <rect x="790" y="258" width="22" height="110" fill="#444444"/>

  <!-- Tapete Antiestático -->
  <rect x="120" y="226" width="680" height="14" rx="3" fill="#29b6f6"/>
  <text x="460" y="237" fill="#1e1e24" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">TAPETE CONDUCTOR / DISIPATIVO ESD</text>

  <!-- Componente electrónico sobre tapete -->
  <g transform="translate(180, 160)">
    <rect x="0" y="0" width="130" height="66" rx="4" fill="#1b5e20" stroke="#81c784" stroke-width="1.5"/>
    <rect x="15" y="12" width="30" height="30" fill="#37474f"/>
    <circle cx="30" cy="27" r="8" fill="#ab47bc"/>
    <rect x="60" y="15" width="55" height="6" fill="#cfd8dc"/>
    <rect x="60" y="26" width="55" height="6" fill="#cfd8dc"/>
    <text x="65" y="56" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">PCB / Placa</text>
  </g>

  <!-- Chasis de PC metálico sobre el tapete -->
  <g transform="translate(620, 95)">
    <rect x="0" y="0" width="130" height="131" rx="4" fill="#37474f" stroke="#78909c" stroke-width="2"/>
    <rect x="15" y="15" width="100" height="25" fill="#263238"/>
    <circle cx="100" cy="110" r="8" fill="#ab47bc"/>
    <text x="65" y="75" fill="#cfd8dc" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Chasis Metálico</text>
  </g>

  <!-- Operario: Brazo y muñeca con pulsera -->
  <g transform="translate(360, 80)">
    <!-- Brazo / Antebrazo -->
    <path d="M 0 30 Q 30 50 60 75" fill="none" stroke="#cfd8dc" stroke-width="16" stroke-linecap="round"/>
    <!-- Mano -->
    <circle cx="65" cy="82" r="10" fill="#cfd8dc"/>
    <!-- Pulsera Antiestática -->
    <rect x="24" y="42" width="22" height="14" rx="3" fill="#ab47bc" stroke="#ffffff" stroke-width="1"/>
    <!-- Broche de pulsera -->
    <circle cx="35" cy="49" r="3" fill="#ffffff"/>
  </g>

  <!-- Cable espiral de la pulsera a tierra -->
  <path d="M 395 129 Q 410 145 395 160 T 395 190 T 395 220 L 400 280" fill="none" stroke="#ab47bc" stroke-width="3" stroke-linecap="round"/>

  <!-- Punto común de puesta a tierra (EBP) -->
  <g transform="translate(450, 270)">
    <circle cx="10" cy="15" r="12" fill="#ab47bc"/>
    <text x="10" y="19" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">EBP</text>
  </g>

  <!-- Enlaces de tierra hacia el punto común -->
  <!-- Cable del tapete al punto central -->
  <polyline points="150,240 150,285 450,285" fill="none" stroke="#29b6f6" stroke-width="2.5" stroke-dasharray="4 3"/>
  <!-- Cable de la pulsera al punto central -->
  <polyline points="400,280 400,285 450,285" fill="none" stroke="#ab47bc" stroke-width="2.5"/>
  <!-- Cable del chasis al punto central -->
  <polyline points="720,226 720,285 470,285" fill="none" stroke="#78909c" stroke-width="2.5" stroke-dasharray="4 3"/>

  <!-- Cable bajante a tierra física -->
  <line x1="460" y1="297" x2="460" y2="345" stroke="#ffffff" stroke-width="3"/>
  <!-- Símbolo de Tierra física -->
  <g transform="translate(460, 345)">
    <line x1="-22" y1="0" x2="22" y2="0" stroke="#ffffff" stroke-width="3"/>
    <line x1="-14" y1="6" x2="14" y2="6" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="-6" y1="12" x2="6" y2="12" stroke="#ffffff" stroke-width="2"/>
    <text x="35" y="10" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Tierra Física</text>
  </g>

  <!-- Cartelas indicadoras -->
  <g transform="translate(80, 75)">
    <rect x="0" y="0" width="220" height="42" rx="6" fill="#2d2d38" stroke="#ab47bc" stroke-width="1.5"/>
    <text x="12" y="18" fill="#ab47bc" font-family="sans-serif" font-size="11" font-weight="bold">Pulsera conectada a EBP</text>
    <text x="12" y="32" fill="#ffffff" font-family="sans-serif" font-size="10">Disipa la carga corporal continua.</text>
  </g>
</svg>
