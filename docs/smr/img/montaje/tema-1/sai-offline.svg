<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%">
  <rect width="100%" height="100%" fill="#1e1e24" rx="8"/>
  <text x="20" y="25" fill="#ab47bc" font-size="13" font-weight="bold" font-family="sans-serif">🔋 SAI Standby / Off-line Pasivo</text>
  
  <!-- Modo Normal -->
  <g transform="translate(10,35)">
    <rect width="580" height="90" rx="6" fill="#262a36" stroke="#37474f"/>
    <text x="15" y="22" fill="#81c784" font-size="11" font-weight="bold" font-family="sans-serif">Modo Normal (Alimentación de Red)</text>
    <rect x="30" y="35" width="50" height="35" rx="4" fill="#37474f"/><text x="55" y="56" fill="#fff" font-size="10" text-anchor="middle" font-family="sans-serif">Red</text>
    <rect x="150" y="45" width="70" height="30" rx="4" fill="#26a69a"/><text x="185" y="63" fill="#fff" font-size="10" text-anchor="middle" font-family="sans-serif">Cargador</text>
    <rect x="270" y="45" width="80" height="30" rx="4" fill="#26a69a"/><text x="310" y="63" fill="#fff" font-size="10" text-anchor="middle" font-weight="bold" font-family="sans-serif">Batería</text>
    <rect x="400" y="45" width="70" height="30" rx="4" fill="#37474f" stroke="#ffb74d"/><text x="435" y="63" fill="#ffb74d" font-size="10" text-anchor="middle" font-family="sans-serif">Inversor</text>
    <rect x="500" y="35" width="60" height="35" rx="4" fill="#37474f" stroke="#ab47bc" stroke-width="2"/><text x="530" y="56" fill="#fff" font-size="10" text-anchor="middle" font-family="sans-serif">Equipo</text>
    <path d="M 80 52 L 500 52" fill="none" stroke="#26a69a" stroke-width="3"/>
  </g>

  <!-- Modo Batería -->
  <g transform="translate(10,135)">
    <rect width="580" height="90" rx="6" fill="#262a36" stroke="#37474f"/>
    <text x="15" y="22" fill="#e57373" font-size="11" font-weight="bold" font-family="sans-serif">Modo Batería (Corte de Red)</text>
    <rect x="30" y="35" width="50" height="35" rx="4" fill="#37474f"/><text x="55" y="56" fill="#fff" font-size="10" text-anchor="middle" font-family="sans-serif">Red</text>
    <rect x="150" y="45" width="70" height="30" rx="4" fill="#ffb74d"/><text x="185" y="63" fill="#fff" font-size="10" text-anchor="middle" font-family="sans-serif">Cargador</text>
    <rect x="270" y="45" width="80" height="30" rx="4" fill="#26a69a"/><text x="310" y="63" fill="#fff" font-size="10" text-anchor="middle" font-weight="bold" font-family="sans-serif">Batería</text>
    <rect x="400" y="45" width="70" height="30" rx="4" fill="#26a69a"/><text x="435" y="63" fill="#fff" font-size="10" text-anchor="middle" font-family="sans-serif">Inversor</text>
    <rect x="500" y="35" width="60" height="35" rx="4" fill="#37474f" stroke="#ab47bc" stroke-width="2"/><text x="530" y="56" fill="#fff" font-size="10" text-anchor="middle" font-family="sans-serif">Equipo</text>
    <path d="M 350 60 L 400 60 M 470 60 L 500 60" fill="none" stroke="#26a69a" stroke-width="3"/>
  </g>
</svg>
