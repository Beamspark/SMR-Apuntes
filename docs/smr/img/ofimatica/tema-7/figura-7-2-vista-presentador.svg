<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 440" width="100%" height="100%">
  <!-- Título Superior -->
  <text x="475" y="35" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Arquitectura de Doble Pantalla en la Vista de Presentador</text>

  <!-- Pantalla 1: Proyección Pública -->
  <rect x="40" y="65" width="410" height="345" rx="8" fill="#1e1e24" stroke="#29b6f6" stroke-width="1.5"/>
  <rect x="40" y="65" width="410" height="40" rx="8" fill="#2a2b36"/>
  <text x="245" y="91" fill="#29b6f6" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">PANTALLA PÚBLICA (Proyector / Auditorio)</text>

  <!-- Marco de la Diapositiva Limpia -->
  <rect x="65" y="125" width="360" height="202" rx="4" fill="#000000" stroke="#29b6f6" stroke-width="2"/>
  <rect x="85" y="145" width="140" height="20" rx="2" fill="#2a2b36"/>
  <text x="95" y="159" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Auditoría SMR Q3</text>
  
  <!-- Gráfico Estadístico Limpio -->
  <rect x="110" y="240" width="35" height="60" fill="#29b6f6"/>
  <rect x="160" y="210" width="35" height="90" fill="#ab47bc"/>
  <rect x="210" y="190" width="35" height="110" fill="#81c784"/>
  <rect x="260" y="225" width="35" height="75" fill="#ffb74d"/>
  
  <text x="245" y="355" fill="#81c784" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">✓ Vista limpia a pantalla completa</text>
  <text x="245" y="375" fill="#b0bec5" font-family="sans-serif" font-size="11" text-anchor="middle">Sin notas, sin interfaz de edición ni cronómetro.</text>

  <!-- Flecha de Conexión Lógica -->
  <path d="M 460 230 L 485 230" stroke="#29b6f6" stroke-width="2"/>

  <!-- Pantalla 2: Monitor del Ponente -->
  <rect x="495" y="65" width="415" height="345" rx="8" fill="#1e1e24" stroke="#ab47bc" stroke-width="1.5"/>
  <rect x="495" y="65" width="415" height="40" rx="8" fill="#2a2b36"/>
  <text x="702" y="91" fill="#ab47bc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">CONSOLA DEL PONENTE (Monitor Privado)</text>

  <!-- Cronómetro y Controles -->
  <rect x="515" y="115" width="180" height="35" rx="4" fill="#141419" stroke="#ab47bc" stroke-width="1"/>
  <text x="525" y="138" fill="#ab47bc" font-family="monospace, sans-serif" font-size="12" font-weight="bold">⏱ 00:14:25</text>
  <text x="615" y="137" fill="#b0bec5" font-family="sans-serif" font-size="10">Pausa / Reset</text>

  <!-- Diapositiva Actual en Pequeño -->
  <rect x="515" y="160" width="180" height="100" rx="3" fill="#000000" stroke="#37474f" stroke-width="1"/>
  <text x="605" y="215" fill="#29b6f6" font-family="sans-serif" font-size="11" text-anchor="middle">[Diapositiva Actual]</text>

  <!-- Siguiente Diapositiva -->
  <rect x="710" y="160" width="180" height="100" rx="3" fill="#141419" stroke="#37474f" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="800" y="205" fill="#b0bec5" font-family="sans-serif" font-size="10" text-anchor="middle">Siguiente diapositiva:</text>
  <text x="800" y="225" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Plan de Contingencia</text>

  <!-- Panel de Notas del Orador -->
  <rect x="515" y="270" width="375" height="120" rx="4" fill="#141419" stroke="#ab47bc" stroke-width="1"/>
  <text x="525" y="290" fill="#ab47bc" font-family="sans-serif" font-size="11" font-weight="bold">Notas del Orador (Guion Técnico Privado):</text>
  <text x="525" y="312" fill="#eceff1" font-family="sans-serif" font-size="11">• Remarcar el incremento del 15% en el uptime de servidores.</text>
  <text x="525" y="332" fill="#eceff1" font-family="sans-serif" font-size="11">• Recordar al comité la renovación de licencias en noviembre.</text>
  <text x="525" y="352" fill="#eceff1" font-family="sans-serif" font-size="11">• No extenderse más de 3 minutos en este punto.</text>
</svg>
