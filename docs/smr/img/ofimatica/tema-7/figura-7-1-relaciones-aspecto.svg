<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 420" width="100%" height="100%">
  <!-- Título Superior -->
  <text x="475" y="35" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Comparativa Estructural: Relación de Aspecto Panorámica (16:9) vs. Estándar (4:3)</text>

  <!-- Bloque Izquierdo: Formato Panorámico 16:9 -->
  <rect x="40" y="65" width="460" height="325" rx="8" fill="#1e1e24" stroke="#29b6f6" stroke-width="1.5"/>
  <rect x="40" y="65" width="460" height="40" rx="8" fill="#2a2b36"/>
  <text x="270" y="91" fill="#29b6f6" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">FORMATO PANORÁMICO 16:9 (Estándar Moderno)</text>

  <!-- Marco de Pantalla 16:9 (Proporción exacta: 384 x 216) -->
  <rect x="78" y="125" width="384" height="216" rx="4" fill="#141419" stroke="#29b6f6" stroke-width="2"/>
  <text x="270" y="235" fill="#29b6f6" font-family="sans-serif" font-size="28" font-weight="bold" text-anchor="middle">16 : 9</text>
  <text x="270" y="265" fill="#b0bec5" font-family="monospace, sans-serif" font-size="13" text-anchor="middle">1920 × 1080 px (Full HD) / 4K UHD</text>

  <!-- Cotas métricas -->
  <line x1="78" y1="115" x2="462" y2="115" stroke="#29b6f6" stroke-width="1.5"/>
  <text x="270" y="110" fill="#29b6f6" font-family="sans-serif" font-size="11" text-anchor="middle">Ancho: 16 unidades</text>

  <line x1="68" y1="125" x2="68" y2="341" stroke="#29b6f6" stroke-width="1.5"/>
  <text x="58" y="235" fill="#29b6f6" font-family="sans-serif" font-size="11" text-anchor="middle" transform="rotate(-90 58 235)">Alto: 9</text>

  <text x="270" y="365" fill="#eceff1" font-family="sans-serif" font-size="11" text-anchor="middle">Optimizado para proyectores digitales modernos, monitores y portátiles.</text>

  <!-- Bloque Derecho: Formato Estándar 4:3 -->
  <rect x="530" y="65" width="380" height="325" rx="8" fill="#1e1e24" stroke="#ab47bc" stroke-width="1.5"/>
  <rect x="530" y="65" width="380" height="40" rx="8" fill="#2a2b36"/>
  <text x="720" y="91" fill="#ab47bc" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">FORMATO ESTÁNDAR 4:3 (Legacy / Impresión)</text>

  <!-- Marco de Pantalla 4:3 (Proporción exacta: 288 x 216) -->
  <rect x="576" y="125" width="288" height="216" rx="4" fill="#141419" stroke="#ab47bc" stroke-width="2"/>
  <text x="720" y="235" fill="#ab47bc" font-family="sans-serif" font-size="28" font-weight="bold" text-anchor="middle">4 : 3</text>
  <text x="720" y="265" fill="#b0bec5" font-family="monospace, sans-serif" font-size="13" text-anchor="middle">1024 × 768 px (XGA)</text>

  <!-- Cotas métricas -->
  <line x1="576" y1="115" x2="864" y2="115" stroke="#ab47bc" stroke-width="1.5"/>
  <text x="720" y="110" fill="#ab47bc" font-family="sans-serif" font-size="11" text-anchor="middle">Ancho: 4 unidades</text>

  <line x1="566" y1="125" x2="566" y2="341" stroke="#ab47bc" stroke-width="1.5"/>
  <text x="556" y="235" fill="#ab47bc" font-family="sans-serif" font-size="11" text-anchor="middle" transform="rotate(-90 556 235)">Alto: 3</text>

  <text x="720" y="365" fill="#eceff1" font-family="sans-serif" font-size="11" text-anchor="middle">Utilizado en proyectores antiguos y maquetaciones para folio impreso.</text>
</svg>
