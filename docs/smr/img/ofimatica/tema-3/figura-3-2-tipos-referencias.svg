<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="100%" height="100%">
  <defs>
    <style>
      .bg-card { fill: #1e1e24; stroke: #2a2b36; stroke-width: 1.5; }
      .bg-card-active { fill: #1e1e24; stroke: #29b6f6; stroke-width: 2; }
      .pill-purple { fill: #ab47bc; rx: 4; }
      .pill-cyan { fill: #29b6f6; rx: 4; }
      .text-title { font-family: 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: bold; fill: #ffffff; }
      .text-syntax { font-family: 'Consolas', 'Courier New', monospace; font-size: 18px; font-weight: bold; fill: #29b6f6; }
      .text-body { font-family: 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #eceff1; }
      .text-dim { font-family: 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #b0bec5; }
      .arrow { stroke: #29b6f6; stroke-width: 2; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#29b6f6" />
    </marker>
  </defs>

  <!-- Título Superior -->
  <text x="30" y="35" class="text-title" style="font-size: 18px; fill: #ab47bc;">MATRIZ DE REFERENCIAS: EFECTO AL COPIAR O ARRASTRAR</text>

  <!-- Tarjeta 1: Relativa -->
  <rect x="25" y="60" width="200" height="330" rx="6" class="bg-card" />
  <rect x="40" y="75" width="170" height="30" rx="4" fill="#2a2b36" />
  <text x="50" y="96" class="text-syntax">A1</text>
  <text x="40" y="130" class="text-title">Totalmente Relativa</text>
  <text x="40" y="160" class="text-body">• Columna: <tspan fill="#81c784">Variable</tspan></text>
  <text x="40" y="185" class="text-body">• Fila: <tspan fill="#81c784">Variable</tspan></text>
  <path d="M 40 210 L 210 210" stroke="#37474f" stroke-width="1" />
  <text x="40" y="235" class="text-dim">Comportamiento:</text>
  <text x="40" y="255" class="text-dim">Se ajusta en ambas</text>
  <text x="40" y="270" class="text-dim">dimensiones siguiendo</text>
  <text x="40" y="285" class="text-dim">el movimiento del cursor.</text>
  <rect x="40" y="320" width="170" height="50" rx="4" fill="#17181c" />
  <text x="48" y="340" class="text-body">=A1 + B1</text>
  <text x="48" y="358" class="text-dim">Copia abajo ➔ =A2 + B2</text>

  <!-- Tarjeta 2: Absoluta -->
  <rect x="250" y="60" width="200" height="330" rx="6" class="bg-card-active" />
  <rect x="265" y="75" width="170" height="30" rx="4" fill="#2a2b36" />
  <text x="275" y="96" class="text-syntax" style="fill: #ab47bc;">$A$1</text>
  <text x="265" y="130" class="text-title">Totalmente Absoluta</text>
  <text x="265" y="160" class="text-body">• Columna: <tspan fill="#e57373">Fija ($)</tspan></text>
  <text x="265" y="185" class="text-body">• Fila: <tspan fill="#e57373">Fija ($)</tspan></text>
  <path d="M 265 210 L 435 210" stroke="#37474f" stroke-width="1" />
  <text x="265" y="235" class="text-dim">Comportamiento:</text>
  <text x="265" y="255" class="text-dim">Permanece anclada de</text>
  <text x="265" y="270" class="text-dim">forma inmutable. Ideal</text>
  <text x="265" y="285" class="text-dim">para IVA, tipos o tasas.</text>
  <rect x="265" y="320" width="170" height="50" rx="4" fill="#17181c" />
  <text x="273" y="340" class="text-body">=A2 * $D$1</text>
  <text x="273" y="358" class="text-dim">Copia abajo ➔ =A3 * $D$1</text>

  <!-- Tarjeta 3: Mixta (Fila fija) -->
  <rect x="475" y="60" width="200" height="330" rx="6" class="bg-card" />
  <rect x="490" y="75" width="170" height="30" rx="4" fill="#2a2b36" />
  <text x="500" y="96" class="text-syntax">A$1</text>
  <text x="490" y="130" class="text-title">Mixta (Fila Fija)</text>
  <text x="490" y="160" class="text-body">• Columna: <tspan fill="#81c784">Variable</tspan></text>
  <text x="490" y="185" class="text-body">• Fila: <tspan fill="#e57373">Fija ($)</tspan></text>
  <path d="M 490 210 L 660 210" stroke="#37474f" stroke-width="1" />
  <text x="490" y="235" class="text-dim">Comportamiento:</text>
  <text x="490" y="255" class="text-dim">Si se arrastra en horizontal</text>
  <text x="490" y="270" class="text-dim">muta a B$1, C$1. Hacia</text>
  <text x="490" y="285" class="text-dim">abajo no cambia la fila.</text>
  <rect x="490" y="320" width="170" height="50" rx="4" fill="#17181c" />
  <text x="498" y="340" class="text-body">=B2 * C$1</text>
  <text x="498" y="358" class="text-dim">Copia abajo ➔ =B3 * C$1</text>

  <!-- Tarjeta 4: Mixta (Columna fija) -->
  <rect x="700" y="60" width="195" height="330" rx="6" class="bg-card" />
  <rect x="715" y="75" width="165" height="30" rx="4" fill="#2a2b36" />
  <text x="725" y="96" class="text-syntax">$A1</text>
  <text x="715" y="130" class="text-title">Mixta (Columna Fija)</text>
  <text x="715" y="160" class="text-body">• Columna: <tspan fill="#e57373">Fija ($)</tspan></text>
  <text x="715" y="185" class="text-body">• Fila: <tspan fill="#81c784">Variable</tspan></text>
  <path d="M 715 210 L 880 210" stroke="#37474f" stroke-width="1" />
  <text x="715" y="235" class="text-dim">Comportamiento:</text>
  <text x="715" y="255" class="text-dim">Al mover a la derecha se</text>
  <text x="715" y="270" class="text-dim">mantiene fija en $A. Hacia</text>
  <text x="715" y="285" class="text-dim">abajo muta a $A2, $A3.</text>
  <rect x="715" y="320" width="165" height="50" rx="4" fill="#17181c" />
  <text x="723" y="340" class="text-body">=$A2 * B1</text>
  <text x="723" y="358" class="text-dim">Copia derecha ➔ =$A2 * C1</text>
</svg>
