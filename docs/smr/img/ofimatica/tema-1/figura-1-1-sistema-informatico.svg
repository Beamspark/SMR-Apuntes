<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" width="100%" height="100%">
  <defs>
    <style>
      .title-box { fill: #ab47bc; rx: 8px; }
      .pillar-box { fill: #1e1e24; stroke: #29b6f6; stroke-width: 2px; rx: 8px; }
      .text-title { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; font-size: 18px; text-anchor: middle; }
      .text-pillar-title { fill: #29b6f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; font-size: 16px; text-anchor: middle; }
      .text-sub { fill: #b0bec5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; text-anchor: middle; font-style: italic; }
      .text-item { fill: #eceff1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; text-anchor: start; }
      .line { stroke: #ab47bc; stroke-width: 2.5px; fill: none; }
    </style>
  </defs>

  <!-- Nodo Central Superior -->
  <rect x="275" y="20" width="300" height="50" class="title-box" />
  <text x="425" y="52" class="text-title">🖧 SISTEMA INFORMÁTICO</text>

  <!-- Líneas Conectoras -->
  <path d="M 425 70 L 425 110 M 145 110 L 705 110 M 145 110 L 145 140 M 425 110 L 425 140 M 705 110 L 705 140" class="line" />

  <!-- Bloque Hardware -->
  <rect x="20" y="140" width="250" height="200" class="pillar-box" />
  <text x="145" y="170" class="text-pillar-title">🛠️ HARDWARE</text>
  <text x="145" y="190" class="text-sub">Componentes tangibles físicos</text>
  <text x="40" y="225" class="text-item">• CPU (GHz, procesamiento)</text>
  <text x="40" y="250" class="text-item">• Memoria RAM y ROM</text>
  <text x="40" y="275" class="text-item">• Almacenamiento (HDD / SSD)</text>
  <text x="40" y="300" class="text-item">• Periféricos (Monitor, E/S)</text>

  <!-- Bloque Software -->
  <rect x="300" y="140" width="250" height="200" class="pillar-box" />
  <text x="425" y="170" class="text-pillar-title">💻 SOFTWARE</text>
  <text x="425" y="190" class="text-sub">Componentes lógicos intangibles</text>
  <text x="320" y="225" class="text-item">• SO (Windows, GNU/Linux)</text>
  <text x="320" y="250" class="text-item">• Suites ofimáticas y apps</text>
  <text x="320" y="275" class="text-item">• Controladores / Drivers</text>
  <text x="320" y="300" class="text-item">• Licenciamiento legal</text>

  <!-- Bloque Personal / Usuarios -->
  <rect x="580" y="140" width="250" height="200" class="pillar-box" />
  <text x="705" y="170" class="text-pillar-title">👥 PERSONAL / USUARIOS</text>
  <text x="705" y="190" class="text-sub">Factor humano y de soporte</text>
  <text x="600" y="225" class="text-item">• Administradores de red</text>
  <text x="600" y="250" class="text-item">• Técnicos CAU / Helpdesk</text>
  <text x="600" y="275" class="text-item">• Usuarios finales corporativos</text>
  <text x="600" y="300" class="text-item">• Desarrolladores y analistas</text>
</svg>
