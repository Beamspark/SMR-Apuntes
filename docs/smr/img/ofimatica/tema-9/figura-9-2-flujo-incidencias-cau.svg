<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 440" width="100%" height="100%">
  <!-- Título Superior -->
  <text x="475" y="35" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Ciclo de Gestión Técnica de Incidencias en el CAU</text>

  <!-- Paso 1: Recepción y Registro -->
  <rect x="30" y="70" width="200" height="110" rx="8" fill="#1e1e24" stroke="#29b6f6" stroke-width="1.5"/>
  <rect x="30" y="70" width="200" height="30" rx="8" fill="#2a2b36"/>
  <text x="130" y="90" fill="#29b6f6" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">1. Recepción y Registro</text>
  <text x="130" y="120" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">Apertura del Ticket</text>
  <text x="130" y="140" fill="#b0bec5" font-family="sans-serif" font-size="10" text-anchor="middle">Asignación de ID y Marca Temporal</text>
  <text x="130" y="160" fill="#29b6f6" font-family="sans-serif" font-size="10" text-anchor="middle">Teléfono / Web / Correo</text>

  <!-- Flecha 1 -> 2 -->
  <line x1="230" y1="125" x2="270" y2="125" stroke="#29b6f6" stroke-width="2"/>
  <polygon points="265,120 275,125 265,130" fill="#29b6f6"/>

  <!-- Paso 2: Triaje y Asignación -->
  <rect x="275" y="70" width="200" height="110" rx="8" fill="#1e1e24" stroke="#29b6f6" stroke-width="1.5"/>
  <rect x="275" y="70" width="200" height="30" rx="8" fill="#2a2b36"/>
  <text x="375" y="90" fill="#29b6f6" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">2. Triaje y Priorización</text>
  <text x="375" y="120" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">Evaluación de Impacto</text>
  <text x="375" y="140" fill="#ffb74d" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Crítico / Alto / Medio / Bajo</text>
  <text x="375" y="160" fill="#b0bec5" font-family="sans-serif" font-size="10" text-anchor="middle">Asignación a Técnico Nivel 1/2</text>

  <!-- Flecha 2 -> 3 -->
  <line x1="475" y1="125" x2="515" y2="125" stroke="#29b6f6" stroke-width="2"/>
  <polygon points="510,120 520,125 510,130" fill="#29b6f6"/>

  <!-- Paso 3: Bifurcación (Conocida vs Desconocida) -->
  <rect x="520" y="70" width="200" height="110" rx="8" fill="#1e1e24" stroke="#ab47bc" stroke-width="1.5"/>
  <rect x="520" y="70" width="200" height="30" rx="8" fill="#2a2b36"/>
  <text x="620" y="90" fill="#ab47bc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">3. Diagnóstico</text>
  <text x="620" y="120" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">¿Incidencia Conocida?</text>
  <text x="620" y="140" fill="#81c784" font-family="sans-serif" font-size="10" text-anchor="middle">SÍ: Aplica Base de Conocimiento</text>
  <text x="620" y="160" fill="#e57373" font-family="sans-serif" font-size="10" text-anchor="middle">NO: Investigación Técnica</text>

  <!-- Flecha 3 -> 4 -->
  <line x1="720" y1="125" x2="760" y2="125" stroke="#29b6f6" stroke-width="2"/>
  <polygon points="755,120 765,125 755,130" fill="#29b6f6"/>

  <!-- Paso 4: Resolución y Cierre -->
  <rect x="765" y="70" width="155" height="110" rx="8" fill="#1e1e24" stroke="#81c784" stroke-width="1.5"/>
  <rect x="765" y="70" width="155" height="30" rx="8" fill="#2a2b36"/>
  <text x="842" y="90" fill="#81c784" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">4. Cierre</text>
  <text x="842" y="120" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">Pruebas Finales</text>
  <text x="842" y="140" fill="#81c784" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Ticket Resuelto</text>
  <text x="842" y="160" fill="#b0bec5" font-family="sans-serif" font-size="10" text-anchor="middle">Validación Usuario</text>

  <!-- Canal de Retorno a la Base de Conocimiento -->
  <path d="M 842 180 L 842 270 L 475 270" fill="none" stroke="#ab47bc" stroke-width="2" stroke-dasharray="5,5"/>
  <polygon points="480,265 470,270 480,275" fill="#ab47bc"/>

  <!-- Bloque Inferior: Base de Conocimiento -->
  <rect x="250" y="300" width="450" height="110" rx="8" fill="#141419" stroke="#ab47bc" stroke-width="1.5"/>
  <rect x="250" y="300" width="450" height="30" rx="8" fill="#2a2b36"/>
  <text x="475" y="320" fill="#ab47bc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">BASE DE CONOCIMIENTO (Histórico Corporativo)</text>
  <text x="475" y="350" fill="#eceff1" font-family="sans-serif" font-size="11" text-anchor="middle">Almacena soluciones contrastadas para convertir fallos desconocidos en conocidos.</text>
  <text x="475" y="375" fill="#29b6f6" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">✓ Optimiza tiempos de resolución (MTTR) y eleva la calidad del soporte.</text>
</svg>
