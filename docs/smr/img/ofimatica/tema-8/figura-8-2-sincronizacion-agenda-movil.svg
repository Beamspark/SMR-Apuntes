<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 420" width="100%" height="100%">
  <!-- Título Superior -->
  <text x="475" y="35" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Sincronización Multidispositivo de Agenda, Correo y Tareas</text>

  <!-- Servidor Central en la Nube -->
  <rect x="345" y="65" width="260" height="150" rx="8" fill="#1e1e24" stroke="#ab47bc" stroke-width="2"/>
  <rect x="345" y="65" width="260" height="35" rx="8" fill="#2a2b36"/>
  <text x="475" y="88" fill="#ab47bc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">SERVIDOR EN LA NUBE (Cloud)</text>
  <text x="475" y="125" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">Google Workspace / Microsoft 365</text>
  <text x="475" y="150" fill="#29b6f6" font-family="monospace, sans-serif" font-size="11" text-anchor="middle">• Buzón IMAP Centralizado</text>
  <text x="475" y="170" fill="#29b6f6" font-family="monospace, sans-serif" font-size="11" text-anchor="middle">• Calendario y Eventos</text>
  <text x="475" y="190" fill="#29b6f6" font-family="monospace, sans-serif" font-size="11" text-anchor="middle">• Base de Datos de Tareas</text>

  <!-- Canal de Comunicación Izquierdo (Wi-Fi de Oficina / LAN) -->
  <path d="M 345 150 L 210 270" fill="none" stroke="#29b6f6" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="240" y="200" fill="#29b6f6" font-family="sans-serif" font-size="11" font-weight="bold">Wi-Fi / LAN</text>

  <!-- Canal de Comunicación Derecho (Datos Móviles 4G/5G) -->
  <path d="M 605 150 L 740 270" fill="none" stroke="#81c784" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="690" y="200" fill="#81c784" font-family="sans-serif" font-size="11" font-weight="bold">Datos 4G / 5G</text>

  <!-- Dispositivo 1: PC de Oficina (Sobremesa / Portátil) -->
  <rect x="80" y="260" width="260" height="135" rx="8" fill="#1e1e24" stroke="#29b6f6" stroke-width="1.5"/>
  <rect x="80" y="260" width="260" height="35" rx="8" fill="#2a2b36"/>
  <text x="210" y="283" fill="#29b6f6" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Estación de Trabajo / Portátil</text>
  <text x="210" y="320" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">Cliente de Correo / Navegador</text>
  <text x="210" y="342" fill="#b0bec5" font-family="sans-serif" font-size="11" text-anchor="middle">Edición de eventos en oficina</text>
  <text x="210" y="365" fill="#81c784" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">✓ Sincronizado en Tiempo Real</text>

  <!-- Dispositivo 2: Terminal Móvil (Smartphone / PDA) -->
  <rect x="610" y="260" width="260" height="135" rx="8" fill="#1e1e24" stroke="#81c784" stroke-width="1.5"/>
  <rect x="610" y="260" width="260" height="35" rx="8" fill="#2a2b36"/>
  <text x="740" y="283" fill="#81c784" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Smartphone / PDA (Técnico)</text>
  <text x="740" y="320" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">App Móvil de Correo y Agenda</text>
  <text x="740" y="342" fill="#b0bec5" font-family="sans-serif" font-size="11" text-anchor="middle">Avisos y notificaciones en campo</text>
  <text x="740" y="365" fill="#81c784" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">✓ Sincronizado en Tiempo Real</text>
</svg>
