<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <!-- Título Superior -->
  <text x="475" y="35" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Circuito Técnico de Envío y Recepción de Correo Electrónico</text>

  <!-- Remitente (Cliente MUA Emisor) -->
  <rect x="30" y="80" width="180" height="110" rx="8" fill="#1e1e24" stroke="#29b6f6" stroke-width="1.5"/>
  <rect x="30" y="80" width="180" height="30" rx="8" fill="#2a2b36"/>
  <text x="120" y="100" fill="#29b6f6" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Remitente (Cliente MUA)</text>
  <text x="120" y="130" fill="#ffffff" font-family="monospace, sans-serif" font-size="11" text-anchor="middle">usuario@empresa.com</text>
  <rect x="65" y="145" width="110" height="25" rx="3" fill="#141419" stroke="#37474f" stroke-width="1"/>
  <text x="120" y="162" fill="#81c784" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Pulsa Enviar</text>

  <!-- Flecha 1: Conexión SMTP al Servidor Origen -->
  <line x1="210" y1="135" x2="300" y2="135" stroke="#29b6f6" stroke-width="2"/>
  <polygon points="295,130 305,135 295,140" fill="#29b6f6"/>
  <text x="255" y="125" fill="#29b6f6" font-family="monospace, sans-serif" font-size="11" text-anchor="middle">SMTP</text>

  <!-- Servidor SMTP Emisor -->
  <rect x="310" y="80" width="200" height="110" rx="8" fill="#1e1e24" stroke="#ab47bc" stroke-width="1.5"/>
  <rect x="310" y="80" width="200" height="30" rx="8" fill="#2a2b36"/>
  <text x="410" y="100" fill="#ab47bc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Servidor SMTP Origen</text>
  <text x="410" y="130" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">mail.empresa.com</text>
  <text x="410" y="150" fill="#b0bec5" font-family="sans-serif" font-size="10" text-anchor="middle">Encola el correo</text>

  <!-- Servidor DNS (Centro Inferior) -->
  <rect x="310" y="270" width="200" height="130" rx="8" fill="#141419" stroke="#ffb74d" stroke-width="1.5"/>
  <rect x="310" y="270" width="200" height="30" rx="8" fill="#2a2b36"/>
  <text x="410" y="290" fill="#ffb74d" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Servidor DNS Público</text>
  <text x="410" y="325" fill="#eceff1" font-family="sans-serif" font-size="11" text-anchor="middle">1. Consulta Registro MX:</text>
  <text x="410" y="345" fill="#ffb74d" font-family="monospace, sans-serif" font-size="11" text-anchor="middle">"destino.com"</text>
  <text x="410" y="375" fill="#81c784" font-family="sans-serif" font-size="11" text-anchor="middle">2. Retorna IP del Servidor</text>

  <!-- Enlace Servidor SMTP <-> DNS -->
  <line x1="380" y1="190" x2="380" y2="265" stroke="#ffb74d" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="375,260 380,270 385,260" fill="#ffb74d"/>
  <line x1="440" y1="265" x2="440" y2="195" stroke="#81c784" stroke-width="2"/>
  <polygon points="435,200 440,190 445,200" fill="#81c784"/>

  <!-- Flecha 2: Conexión SMTP hacia Servidor Destino -->
  <line x1="510" y1="135" x2="610" y2="135" stroke="#29b6f6" stroke-width="2"/>
  <polygon points="605,130 615,135 605,140" fill="#29b6f6"/>
  <text x="560" y="125" fill="#29b6f6" font-family="monospace, sans-serif" font-size="11" text-anchor="middle">SMTP (Red)</text>

  <!-- Servidor Receptor (Destino) -->
  <rect x="620" y="80" width="200" height="110" rx="8" fill="#1e1e24" stroke="#ab47bc" stroke-width="1.5"/>
  <rect x="620" y="80" width="200" height="30" rx="8" fill="#2a2b36"/>
  <text x="720" y="100" fill="#ab47bc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Servidor Correo Destino</text>
  <text x="720" y="130" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">mail.destino.com</text>
  <text x="720" y="150" fill="#b0bec5" font-family="sans-serif" font-size="10" text-anchor="middle">Buzón del usuario</text>

  <!-- Flecha 3: Descarga POP3 / IMAP -->
  <line x1="720" y1="190" x2="720" y2="295" stroke="#81c784" stroke-width="2"/>
  <polygon points="715,290 720,300 725,290" fill="#81c784"/>
  <text x="795" y="245" fill="#81c784" font-family="monospace, sans-serif" font-size="11" text-anchor="middle">POP3 / IMAP</text>

  <!-- Destinatario Final (Cliente MUA Receptor) -->
  <rect x="630" y="305" width="180" height="110" rx="8" fill="#1e1e24" stroke="#29b6f6" stroke-width="1.5"/>
  <rect x="630" y="305" width="180" height="30" rx="8" fill="#2a2b36"/>
  <text x="720" y="325" fill="#29b6f6" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Destinatario (Cliente MUA)</text>
  <text x="720" y="355" fill="#ffffff" font-family="monospace, sans-serif" font-size="11" text-anchor="middle">operador@destino.com</text>
  <rect x="660" y="370" width="120" height="25" rx="3" fill="#141419" stroke="#37474f" stroke-width="1"/>
  <text x="720" y="387" fill="#29b6f6" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Lectura del Correo</text>
</svg>
