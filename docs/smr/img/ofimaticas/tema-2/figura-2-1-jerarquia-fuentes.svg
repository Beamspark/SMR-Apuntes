<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="100%" height="100%">
  <defs>
    <style>
      .tier-card { fill: #1e1e24; stroke: #29b6f6; stroke-width: 1.5px; rx: 6px; }
      .badge-pts { fill: #ab47bc; rx: 4px; }
      .text-pts { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: bold; text-anchor: middle; }
      .text-title { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: bold; }
      .text-sub { fill: #29b6f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: bold; }
      .text-body { fill: #eceff1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; }
      .text-footnote { fill: #b0bec5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-style: italic; }
      .text-desc { fill: #90a4ae; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
    </style>
  </defs>

  <!-- Nivel 1: Título Principal -->
  <rect x="20" y="20" width="760" height="50" class="tier-card" />
  <rect x="35" y="32" width="75" height="24" class="badge-pts" />
  <text x="72" y="48" class="text-pts">18 - 24 pt</text>
  <text x="125" y="50" class="text-title">Título Principal del Documento Técnico</text>
  <text x="560" y="50" class="text-desc">Apertura de portadas y capítulos</text>

  <!-- Nivel 2: Subtítulos -->
  <rect x="20" y="78" width="760" height="50" class="tier-card" />
  <rect x="35" y="90" width="75" height="24" class="badge-pts" />
  <text x="72" y="106" class="text-pts">14 - 18 pt</text>
  <text x="125" y="108" class="text-sub">Subtítulos y Secciones Jerárquicas (Encabezados H1, H2)</text>
  <text x="560" y="108" class="text-desc">Estructuración y desglose de temas</text>

  <!-- Nivel 3: Cuerpo de Texto -->
  <rect x="20" y="136" width="760" height="50" class="tier-card" />
  <rect x="35" y="148" width="75" height="24" class="badge-pts" />
  <text x="72" y="164" class="text-pts">10 - 12 pt</text>
  <text x="125" y="166" class="text-body">Cuerpo general del documento: párrafos, explicaciones técnicas y listas.</text>
  <text x="560" y="166" class="text-desc">Bloque principal de lectura</text>

  <!-- Nivel 4: Notas al Pie -->
  <rect x="20" y="194" width="760" height="50" class="tier-card" />
  <rect x="35" y="206" width="75" height="24" class="badge-pts" />
  <text x="72" y="222" class="text-pts">8 - 10 pt</text>
  <text x="125" y="224" class="text-footnote">Notas al pie, referencias bibliográficas, pies de foto y aclaraciones marginales.</text>
  <text x="560" y="224" class="text-desc">Información secundaria reducida</text>
</svg>
