<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" height="100%">
  <defs>
    <style>
      .bg-panel { fill: #1e1e24; stroke: #2a2b36; stroke-width: 1.5; }
      .bg-box { fill: #2a2b36; stroke: #37474f; stroke-width: 1; }
      .bg-result { fill: #17181c; stroke: #29b6f6; stroke-width: 1.5; }
      .text-title { font-family: 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: bold; fill: #ffffff; }
      .text-formula { font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; fill: #29b6f6; }
      .text-warn { font-family: 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #e57373; }
      .text-success { font-family: 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #81c784; }
      .text-body { font-family: 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #eceff1; }
      .arrow { stroke: #ab47bc; stroke-width: 2; fill: none; marker-end: url(#arrow-purple); }
    </style>
    <marker id="arrow-purple" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#ab47bc" />
    </marker>
  </defs>

  <!-- Panel Izquierdo: Enfoque Convencional -->
  <rect x="25" y="20" width="410" height="360" rx="8" class="bg-panel" />
  <text x="45" y="50" class="text-title">Enfoque Celda por Celda (Convencional)</text>
  <text x="45" y="75" class="text-warn">Requiere copiar y arrastrar manualmente</text>

  <!-- Celdas individuales con fórmulas repetidas -->
  <rect x="45" y="100" width="370" height="45" rx="4" class="bg-box" />
  <text x="60" y="128" class="text-formula">C2: =A2 * B2</text>
  <rect x="45" y="155" width="370" height="45" rx="4" class="bg-box" />
  <text x="60" y="183" class="text-formula">C3: =A3 * B3</text>
  <rect x="45" y="210" width="370" height="45" rx="4" class="bg-box" />
  <text x="60" y="238" class="text-formula">C4: =A4 * B4</text>
  <rect x="45" y="265" width="370" height="45" rx="4" class="bg-box" />
  <text x="60" y="293" class="text-formula">C5: =A5 * B5</text>

  <text x="45" y="340" class="text-body">• Riego de desincronización si se insertan filas.</text>
  <text x="45" y="360" class="text-body">• Mayor consumo de memoria en libros masivos.</text>

  <!-- Panel Derecho: Enfoque Matricial -->
  <rect x="465" y="20" width="410" height="360" rx="8" class="bg-panel" style="stroke: #ab47bc;" />
  <text x="485" y="50" class="text-title">Enfoque Matricial (ARRAYFORMULA)</text>
  <text x="485" y="75" class="text-success">Una única expresión procesa todo el rango</text>

  <!-- Única Celda Maestra C2 -->
  <rect x="485" y="100" width="370" height="50" rx="4" class="bg-result" />
  <text x="500" y="130" class="text-formula" style="font-weight: bold;">C2: =ARRAYFORMULA(A2:A5 * B2:B5)</text>

  <!-- Flechas de Desbordamiento Automático -->
  <path d="M 520 155 L 520 185" class="arrow" />
  <path d="M 520 210 L 520 240" class="arrow" />
  <path d="M 520 265 L 520 295" class="arrow" />

  <!-- Bloque virtual de resultados -->
  <rect x="545" y="165" width="310" height="35" rx="4" fill="#17181c" stroke="#2a2b36" />
  <text x="560" y="188" class="text-body">Resultado Fila 3 (Generado dinámicamente)</text>
  <rect x="545" y="220" width="310" height="35" rx="4" fill="#17181c" stroke="#2a2b36" />
  <text x="560" y="243" class="text-body">Resultado Fila 4 (Generado dinámicamente)</text>
  <rect x="545" y="275" width="310" height="35" rx="4" fill="#17181c" stroke="#2a2b36" />
  <text x="560" y="298" class="text-body">Resultado Fila 5 (Generado dinámicamente)</text>

  <text x="485" y="340" class="text-body">• Celdas protegidas: no se pueden editar por error.</text>
  <text x="485" y="360" class="text-body">• Actualización reactiva instantánea ante nuevas filas.</text>
</svg>
