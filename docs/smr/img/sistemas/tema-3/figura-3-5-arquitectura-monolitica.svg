<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 440" width="100%">
  <rect width="100%" height="100%" fill="#1e1e24" rx="12"/>

  <!-- Columna Izquierda: Rótulo -->
  <rect x="20" y="20" width="35" height="400" rx="4" fill="#ab47bc" fill-opacity="0.3" stroke="#ab47bc" stroke-width="1.5"/>
  <text x="42" y="220" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif" transform="rotate(-90 42 220)" text-anchor="middle">Arquitectura monolítica (Servicios integrados en el Kernel)</text>

  <!-- Capa 1: Modo Usuario -->
  <g transform="translate(80, 20)">
    <rect x="0" y="0" width="640" height="90" rx="6" fill="#29b6f6" fill-opacity="0.15" stroke="#29b6f6" stroke-width="1.5"/>
    <text x="15" y="25" fill="#29b6f6" font-size="13" font-weight="bold" font-family="sans-serif">Modo usuario</text>
    
    <rect x="150" y="30" width="450" height="40" rx="4" fill="#2d2d38" stroke="#29b6f6" stroke-width="1"/>
    <text x="375" y="55" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">Aplicaciones de usuario</text>
  </g>

  <!-- Flecha Intermedia -->
  <path d="M 400 115 L 400 135" stroke="#ab47bc" stroke-width="2" fill="none"/>
  <polygon points="400,110 395,118 405,118" fill="#ab47bc"/>
  <polygon points="400,140 395,132 405,132" fill="#ab47bc"/>

  <!-- Capa 2: Modo Núcleo (Kernel Monolítico) -->
  <g transform="translate(80, 145)">
    <rect x="0" y="0" width="640" height="170" rx="6" fill="#ffb74d" fill-opacity="0.2" stroke="#ffb74d" stroke-width="1.5"/>
    <text x="15" y="25" fill="#ffb74d" font-size="13" font-weight="bold" font-family="sans-serif">Modo núcleo (Kernel)</text>

    <!-- Módulos Integrados -->
    <rect x="150" y="20" width="210" height="35" rx="3" fill="#ffb74d" fill-opacity="0.4" stroke="#ffb74d"/>
    <text x="255" y="42" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Gestión de procesos</text>

    <rect x="380" y="20" width="220" height="35" rx="3" fill="#ffb74d" fill-opacity="0.4" stroke="#ffb74d"/>
    <text x="490" y="42" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Gestión de memoria</text>

    <rect x="150" y="65" width="210" height="35" rx="3" fill="#ffb74d" fill-opacity="0.4" stroke="#ffb74d"/>
    <text x="255" y="87" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Sistema de archivos</text>

    <rect x="380" y="65" width="220" height="35" rx="3" fill="#ffb74d" fill-opacity="0.4" stroke="#ffb74d"/>
    <text x="490" y="87" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Gestión de E/S</text>

    <rect x="150" y="110" width="450" height="35" rx="3" fill="#ffb74d" fill-opacity="0.6" stroke="#ffb74d"/>
    <text x="375" y="132" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">Drivers / Controladores de dispositivos</text>
  </g>

  <!-- Flecha Intermedia -->
  <path d="M 400 320 L 400 340" stroke="#ab47bc" stroke-width="2" fill="none"/>
  <polygon points="400,315 395,323 405,323" fill="#ab47bc"/>
  <polygon points="400,345 395,337 405,337" fill="#ab47bc"/>

  <!-- Capa 3: Hardware -->
  <g transform="translate(80, 350)">
    <rect x="0" y="0" width="640" height="70" rx="6" fill="#ab47bc" fill-opacity="0.2" stroke="#ab47bc" stroke-width="1.5"/>
    <text x="15" y="40" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif">Hardware</text>

    <rect x="150" y="15" width="100" height="40" rx="3" fill="#2d2d38" stroke="#ab47bc"/>
    <text x="200" y="39" fill="#ffffff" font-size="11" font-family="sans-serif" text-anchor="middle">CPU</text>

    <rect x="260" y="15" width="100" height="40" rx="3" fill="#2d2d38" stroke="#ab47bc"/>
    <text x="310" y="39" fill="#ffffff" font-size="11" font-family="sans-serif" text-anchor="middle">Memoria</text>

    <rect x="370" y="15" width="110" height="40" rx="3" fill="#2d2d38" stroke="#ab47bc"/>
    <text x="425" y="39" fill="#ffffff" font-size="11" font-family="sans-serif" text-anchor="middle">E/S</text>

    <rect x="490" y="15" width="110" height="40" rx="3" fill="#2d2d38" stroke="#ab47bc"/>
    <text x="545" y="39" fill="#ffffff" font-size="11" font-family="sans-serif" text-anchor="middle">Discos</text>
  </g>
</svg>
