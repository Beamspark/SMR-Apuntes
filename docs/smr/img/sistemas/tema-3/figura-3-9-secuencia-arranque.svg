<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 240" width="100%">
  <rect width="100%" height="100%" fill="#1e1e24" rx="12"/>

  <!-- Paso 1 -->
  <g transform="translate(30, 30)">
    <rect x="0" y="0" width="160" height="180" rx="8" fill="#2d2d38" stroke="#ab47bc" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="12" fill="#ab47bc"/><text x="20" y="24" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">1</text>
    <rect x="40" y="30" width="80" height="50" rx="4" fill="#ab47bc" fill-opacity="0.3" stroke="#ab47bc"/>
    <text x="80" y="115" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">POST</text>
    <text x="80" y="135" fill="#29b6f6" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">(BIOS/UEFI)</text>
  </g>

  <!-- Paso 2 -->
  <g transform="translate(215, 30)">
    <rect x="0" y="0" width="160" height="180" rx="8" fill="#2d2d38" stroke="#ab47bc" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="12" fill="#ab47bc"/><text x="20" y="24" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">2</text>
    <rect x="40" y="30" width="80" height="50" rx="4" fill="#ffb74d" fill-opacity="0.3" stroke="#ffb74d"/>
    <text x="80" y="110" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">Gestor de</text>
    <text x="80" y="128" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">arranque</text>
    <text x="80" y="146" fill="#29b6f6" font-size="10" font-family="sans-serif" text-anchor="middle">(bootloader)</text>
  </g>

  <!-- Paso 3 -->
  <g transform="translate(400, 30)">
    <rect x="0" y="0" width="160" height="180" rx="8" fill="#2d2d38" stroke="#ab47bc" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="12" fill="#ab47bc"/><text x="20" y="24" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">3</text>
    <rect x="40" y="30" width="80" height="50" rx="4" fill="#ab47bc" fill-opacity="0.3" stroke="#ab47bc"/>
    <text x="80" y="115" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">Carga del</text>
    <text x="80" y="133" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">kernel</text>
  </g>

  <!-- Paso 4 -->
  <g transform="translate(585, 30)">
    <rect x="0" y="0" width="160" height="180" rx="8" fill="#2d2d38" stroke="#ab47bc" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="12" fill="#ab47bc"/><text x="20" y="24" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">4</text>
    <rect x="40" y="30" width="80" height="50" rx="4" fill="#29b6f6" fill-opacity="0.3" stroke="#29b6f6"/>
    <text x="80" y="110" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">Inicio del</text>
    <text x="80" y="128" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">sistema</text>
    <text x="80" y="146" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">operativo</text>
  </g>
</svg>
