<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="100%">
  <rect width="100%" height="100%" fill="#1e1e24" rx="10"/>

  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="680" height="240" rx="6" fill="#f8f9fa" stroke="#ab47bc" stroke-width="1.5"/>
    
    <!-- Cabecera VirtualBox -->
    <text x="15" y="20" fill="#333333" font-size="11" font-weight="bold" font-family="sans-serif">Oracle VirtualBox Administrador — Recursos</text>
    <line x1="0" y1="30" x2="680" y2="30" stroke="#e0e0e0"/>

    <!-- Indicadores Circulares (Anillos) -->
    <!-- CPU -->
    <g transform="translate(80, 85)">
      <circle cx="0" cy="0" r="30" fill="none" stroke="#cccccc" stroke-width="6"/>
      <circle cx="0" cy="0" r="30" fill="none" stroke="#2196f3" stroke-width="6" stroke-dasharray="15 180"/>
      <text x="0" y="-45" fill="#333333" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Carga de CPU</text>
      <text x="0" y="4" fill="#333333" font-size="10" font-family="sans-serif" text-anchor="middle">1366 MHz</text>
    </g>

    <!-- RAM Anfitrión -->
    <g transform="translate(340, 85)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#0026ca" stroke-width="12"/>
      <circle cx="0" cy="0" r="32" fill="none" stroke="#ff0000" stroke-width="12" stroke-dasharray="120 200"/>
      <text x="0" y="-45" fill="#333333" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Uso de RAM anfitrión</text>
      <text x="0" y="-2" fill="#ffffff" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">61%</text>
      <text x="0" y="10" fill="#ffffff" font-size="9" font-family="sans-serif" text-anchor="middle">Usada</text>
    </g>

    <!-- Tabla de Métricas de VMs -->
    <g transform="translate(10, 150)">
      <rect x="0" y="0" width="660" height="70" fill="#ffffff" stroke="#e0e0e0"/>
      <rect x="0" y="0" width="660" height="22" fill="#f0f0f0"/>
      <text x="20" y="15" fill="#333333" font-size="10" font-weight="bold" font-family="sans-serif">Nombre VM</text>
      <text x="200" y="15" fill="#333333" font-size="10" font-weight="bold" font-family="sans-serif">CPU invitado</text>
      <text x="350" y="15" fill="#333333" font-size="10" font-weight="bold" font-family="sans-serif">CPU VMM</text>
      <text x="500" y="15" fill="#333333" font-size="10" font-weight="bold" font-family="sans-serif">RAM usada / total</text>

      <text x="20" y="45" fill="#0056b3" font-size="11" font-family="sans-serif">Windows 10</text>
      <text x="200" y="45" fill="#333333" font-size="11" font-family="sans-serif">5%</text>
      <text x="350" y="45" fill="#333333" font-size="11" font-family="sans-serif">60%</text>
      <text x="500" y="45" fill="#333333" font-size="11" font-family="sans-serif">4096 MB / 31.68 GB</text>
    </g>
  </g>
</svg>
