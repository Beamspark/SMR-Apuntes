<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 260" width="100%">
  <rect width="100%" height="100%" fill="#1e1e24" rx="12"/>

  <!-- Indicadores MSB / LSB Superior -->
  <text x="160" y="35" fill="#ab47bc" font-size="14" font-weight="bold" font-family="sans-serif">MSB ↓</text>
  <text x="640" y="35" fill="#29b6f6" font-size="14" font-weight="bold" font-family="sans-serif">LSB ↓</text>

  <!-- Fila 1: Potencias b^n (Cabecera) -->
  <g transform="translate(130, 50)">
    <rect x="0" y="0" width="580" height="45" rx="6" fill="#ab47bc" fill-opacity="0.8"/>
    <path d="M 72.5 0 L 72.5 45 M 145 0 L 145 45 M 217.5 0 L 217.5 45 M 290 0 L 290 45 M 362.5 0 L 362.5 45 M 435 0 L 435 45 M 507.5 0 L 507.5 45" stroke="#1e1e24" stroke-width="2"/>
    <text x="36" y="28" fill="#ffffff" font-size="15" font-weight="bold" font-family="sans-serif" text-anchor="middle">b⁷</text>
    <text x="108" y="28" fill="#ffffff" font-size="15" font-weight="bold" font-family="sans-serif" text-anchor="middle">b⁶</text>
    <text x="181" y="28" fill="#ffffff" font-size="15" font-weight="bold" font-family="sans-serif" text-anchor="middle">b⁵</text>
    <text x="253" y="28" fill="#ffffff" font-size="15" font-weight="bold" font-family="sans-serif" text-anchor="middle">b⁴</text>
    <text x="326" y="28" fill="#ffffff" font-size="15" font-weight="bold" font-family="sans-serif" text-anchor="middle">b³</text>
    <text x="398" y="28" fill="#ffffff" font-size="15" font-weight="bold" font-family="sans-serif" text-anchor="middle">b²</text>
    <text x="471" y="28" fill="#ffffff" font-size="15" font-weight="bold" font-family="sans-serif" text-anchor="middle">b¹</text>
    <text x="543" y="28" fill="#ffffff" font-size="15" font-weight="bold" font-family="sans-serif" text-anchor="middle">b⁰</text>
  </g>

  <!-- Fila 2: Potencia de 2 (Peso) -->
  <text x="25" y="122" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif">Potencia de 2</text>
  <text x="25" y="138" fill="#ab47bc" font-size="12" font-family="sans-serif">(Peso)</text>

  <g transform="translate(130, 100)">
    <rect x="0" y="0" width="580" height="50" rx="4" fill="#2d2d38" stroke="#ab47bc" stroke-width="1.5"/>
    <path d="M 72.5 0 L 72.5 50 M 145 0 L 145 50 M 217.5 0 L 217.5 50 M 290 0 L 290 50 M 362.5 0 L 362.5 50 M 435 0 L 435 50 M 507.5 0 L 507.5 50" stroke="#ab47bc" stroke-width="1"/>
    <text x="36" y="30" fill="#29b6f6" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">2⁷</text>
    <text x="108" y="30" fill="#29b6f6" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">2⁶</text>
    <text x="181" y="30" fill="#29b6f6" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">2⁵</text>
    <text x="253" y="30" fill="#29b6f6" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">2⁴</text>
    <text x="326" y="30" fill="#29b6f6" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">2³</text>
    <text x="398" y="30" fill="#29b6f6" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">2²</text>
    <text x="471" y="30" fill="#29b6f6" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">2¹</text>
    <text x="543" y="30" fill="#29b6f6" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">2⁰</text>
  </g>

  <!-- Fila 3: Valor del peso -->
  <text x="25" y="188" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif">Valor del peso</text>

  <g transform="translate(130, 160)">
    <rect x="0" y="0" width="580" height="50" rx="4" fill="#2d2d38" stroke="#29b6f6" stroke-width="1.5"/>
    <path d="M 72.5 0 L 72.5 50 M 145 0 L 145 50 M 217.5 0 L 217.5 50 M 290 0 L 290 50 M 362.5 0 L 362.5 50 M 435 0 L 435 50 M 507.5 0 L 507.5 50" stroke="#29b6f6" stroke-width="1"/>
    <text x="36" y="30" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">128</text>
    <text x="108" y="30" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">64</text>
    <text x="181" y="30" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">32</text>
    <text x="253" y="30" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">16</text>
    <text x="326" y="30" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">8</text>
    <text x="398" y="30" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">4</text>
    <text x="471" y="30" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">2</text>
    <text x="543" y="30" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">1</text>
  </g>
</svg>
