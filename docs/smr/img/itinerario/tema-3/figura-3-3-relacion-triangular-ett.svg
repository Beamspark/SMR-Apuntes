<svg viewBox="0 0 680 460" width="100%" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#1e1e24" rx="10"/>

  <defs>
    <marker id="arrow-tri-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#29b6f6"/>
    </marker>
  </defs>

  <!-- ETT (Vértice Superior) -->
  <g transform="translate(240, 30)">
    <rect x="0" y="0" width="200" height="85" rx="8" fill="#2d2d38" stroke="#ab47bc" stroke-width="2"/>
    <text x="100" y="50" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">ETT</text>
  </g>

  <!-- TRABAJADOR (Vértice Inferior Izquierdo) -->
  <g transform="translate(30, 320)">
    <rect x="0" y="0" width="200" height="85" rx="8" fill="#2d2d38" stroke="#29b6f6" stroke-width="2"/>
    <text x="100" y="50" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">TRABAJADOR</text>
  </g>

  <!-- EMPRESA USUARIA (Vértice Inferior Derecho) -->
  <g transform="translate(450, 320)">
    <rect x="0" y="0" width="200" height="85" rx="8" fill="#2d2d38" stroke="#29b6f6" stroke-width="2"/>
    <text x="100" y="42" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">EMPRESA</text>
    <text x="100" y="62" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">USUARIA</text>
  </g>

  <!-- Relación ETT <-> TRABAJADOR -->
  <line x1="245" y1="120" x2="160" y2="310" stroke="#29b6f6" stroke-width="2" marker-end="url(#arrow-tri-blue)"/>
  <line x1="175" y1="310" x2="260" y2="120" stroke="#29b6f6" stroke-width="2" marker-end="url(#arrow-tri-blue)"/>
  <text x="175" y="195" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="end">Contrato laboral</text>
  <text x="245" y="240" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="start">Salario</text>

  <!-- Relación ETT <-> EMPRESA USUARIA -->
  <line x1="420" y1="120" x2="495" y2="310" stroke="#29b6f6" stroke-width="2" marker-end="url(#arrow-tri-blue)"/>
  <line x1="510" y1="310" x2="435" y2="120" stroke="#29b6f6" stroke-width="2" marker-end="url(#arrow-tri-blue)"/>
  <text x="440" y="225" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="end">Precio del servicio</text>
  <text x="505" y="195" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="start">Contrato mercantil</text>

  <!-- Relación TRABAJADOR <-> EMPRESA USUARIA -->
  <line x1="440" y1="350" x2="240" y2="350" stroke="#29b6f6" stroke-width="2" marker-end="url(#arrow-tri-blue)"/>
  <text x="340" y="340" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">Dirige y controla el servicio</text>

  <line x1="240" y1="380" x2="440" y2="380" stroke="#29b6f6" stroke-width="2" marker-end="url(#arrow-tri-blue)"/>
  <text x="340" y="405" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">Ofrece su fuerza de trabajo</text>
</svg>
