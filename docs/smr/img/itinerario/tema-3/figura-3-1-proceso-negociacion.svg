<svg viewBox="0 0 950 160" width="100%" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#1e1e24" rx="10"/>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#29b6f6"/>
    </marker>
  </defs>

  <!-- Paso 1 -->
  <g transform="translate(25, 30)">
    <rect x="0" y="0" width="150" height="100" rx="8" fill="#2d2d38" stroke="#29b6f6" stroke-width="2"/>
    <text x="75" y="45" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Propuesta de</text>
    <text x="75" y="65" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">negociación</text>
  </g>

  <!-- Flecha 1 -->
  <line x1="180" y1="80" x2="205" y2="80" stroke="#29b6f6" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <!-- Paso 2 -->
  <g transform="translate(215, 30)">
    <rect x="0" y="0" width="150" height="100" rx="8" fill="#2d2d38" stroke="#29b6f6" stroke-width="2"/>
    <text x="75" y="55" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Respuesta</text>
  </g>

  <!-- Flecha 2 -->
  <line x1="370" y1="80" x2="395" y2="80" stroke="#29b6f6" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <!-- Paso 3 -->
  <g transform="translate(405, 30)">
    <rect x="0" y="0" width="150" height="100" rx="8" fill="#2d2d38" stroke="#29b6f6" stroke-width="2"/>
    <text x="75" y="38" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Constitución de</text>
    <text x="75" y="56" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">la comisión</text>
    <text x="75" y="74" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">negociadora</text>
  </g>

  <!-- Flecha 3 -->
  <line x1="560" y1="80" x2="585" y2="80" stroke="#29b6f6" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <!-- Paso 4 -->
  <g transform="translate(595, 30)">
    <rect x="0" y="0" width="150" height="100" rx="8" fill="#2d2d38" stroke="#29b6f6" stroke-width="2"/>
    <text x="75" y="40" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Deliberación y</text>
    <text x="75" y="58" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">adopción de</text>
    <text x="75" y="76" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">acuerdos</text>
  </g>

  <!-- Flecha 4 -->
  <line x1="750" y1="80" x2="775" y2="80" stroke="#29b6f6" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <!-- Paso 5 -->
  <g transform="translate(785, 30)">
    <rect x="0" y="0" width="140" height="100" rx="8" fill="#2d2d38" stroke="#ab47bc" stroke-width="2"/>
    <text x="70" y="45" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Registro y</text>
    <text x="70" y="65" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">publicación</text>
  </g>
</svg>
