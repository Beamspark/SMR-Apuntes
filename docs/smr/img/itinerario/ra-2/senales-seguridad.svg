<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 200" width="100%" max-width="650" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <rect width="650" height="200" fill="#ffffff" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Señal 1: Prohibición -->
  <g transform="translate(45, 15)">
    <circle cx="65" cy="65" r="55" fill="#ffffff" stroke="#e53935" stroke-width="12"/>
    <!-- Cigarrillo -->
    <rect x="35" y="60" width="40" height="10" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    <rect x="75" y="60" width="15" height="10" fill="#f59e0b"/>
    <path d="M 33 60 C 25 55, 30 45, 23 40" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 37 60 C 31 52, 36 43, 30 38" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Barra diagonal de prohibición -->
    <line x1="28" y1="28" x2="102" y2="102" stroke="#e53935" stroke-width="12" stroke-linecap="round"/>
    <text x="65" y="155" fill="#0f172a" font-size="16" font-weight="bold" text-anchor="middle">Señal 1</text>
  </g>
  <!-- Señal 2: Advertencia -->
  <g transform="translate(245, 15)">
    <polygon points="65,12 10,118 120,118" fill="#fbc02d" stroke="#fbc02d" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="65,22 20,112 110,112" fill="#fbc02d"/>
    <!-- Signo de exclamación -->
    <rect x="61" y="48" width="8" height="38" rx="4" fill="#000000"/>
    <circle cx="65" cy="98" r="5" fill="#000000"/>
    <text x="65" y="155" fill="#0f172a" font-size="16" font-weight="bold" text-anchor="middle">Señal 2</text>
  </g>
  <!-- Señal 3: Obligación -->
  <g transform="translate(445, 15)">
    <circle cx="65" cy="65" r="58" fill="#0288d1" stroke="#ffffff" stroke-width="2"/>
    <circle cx="65" cy="65" r="62" fill="none" stroke="#0288d1" stroke-width="3"/>
    <!-- Casco y protectores auditivos simplificados -->
    <path d="M 40 68 C 40 45, 90 45, 90 68 Z" fill="#ffffff"/>
    <ellipse cx="65" cy="68" rx="28" ry="4" fill="#ffffff"/>
    <rect x="36" y="65" width="8" height="20" rx="3" fill="#ffffff"/>
    <rect x="86" y="65" width="8" height="20" rx="3" fill="#ffffff"/>
    <path d="M 40 65 C 40 38, 90 38, 90 65" stroke="#ffffff" stroke-width="4" fill="none"/>
    <text x="65" y="155" fill="#0f172a" font-size="16" font-weight="bold" text-anchor="middle">Señal 3</text>
  </g>
</svg>
