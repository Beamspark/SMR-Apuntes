<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%">
  <rect width="100%" height="100%" fill="#1e1e24" rx="8"/>
  
  <!-- Circuito Original (Izquierda) -->
  <line x1="40" y1="90" x2="60" y2="90" stroke="#eceff1" stroke-width="2"/>
  <line x1="45" y1="110" x2="55" y2="110" stroke="#eceff1" stroke-width="4"/>
  <text x="10" y="105" fill="#eceff1" font-size="14" font-weight="bold" font-family="sans-serif">6 V</text>
  <path d="M 50 90 L 50 40 L 120 40 M 180 40 L 250 40 L 250 80 M 250 120 L 250 160 L 180 160 M 120 160 L 50 160 L 50 110" fill="none" stroke="#78909c" stroke-width="2"/>
  
  <rect x="120" y="30" width="60" height="20" fill="#262a36" stroke="#ab47bc" stroke-width="2"/>
  <text x="150" y="44" fill="#fff" font-size="11" text-anchor="middle" font-family="sans-serif">R1 (10 Ω)</text>
  
  <rect x="240" y="80" width="20" height="40" fill="#262a36" stroke="#ab47bc" stroke-width="2"/>
  <text x="250" y="104" fill="#fff" font-size="10" text-anchor="middle" transform="rotate(270 250,104)" font-family="sans-serif">R2 (5 Ω)</text>
  
  <rect x="120" y="150" width="60" height="20" fill="#262a36" stroke="#ab47bc" stroke-width="2"/>
  <text x="150" y="164" fill="#fff" font-size="11" text-anchor="middle" font-family="sans-serif">R3 (15 Ω)</text>

  <!-- Flecha Equivalencia -->
  <text x="320" y="108" fill="#29b6f6" font-size="28" font-weight="bold" font-family="sans-serif">⇒</text>

  <!-- Circuito Equivalente (Derecha) -->
  <line x1="400" y1="90" x2="420" y2="90" stroke="#eceff1" stroke-width="2"/>
  <line x1="405" y1="110" x2="415" y2="110" stroke="#eceff1" stroke-width="4"/>
  <text x="365" y="105" fill="#eceff1" font-size="14" font-weight="bold" font-family="sans-serif">6 V</text>
  <path d="M 410 90 L 410 50 L 530 50 L 530 70 M 530 130 L 530 150 L 410 150 L 410 110" fill="none" stroke="#78909c" stroke-width="2"/>
  
  <rect x="520" y="70" width="20" height="60" fill="#262a36" stroke="#66bb6a" stroke-width="2"/>
  <text x="530" y="104" fill="#fff" font-size="11" text-anchor="middle" transform="rotate(270 530,104)" font-family="sans-serif">Rt (30 Ω)</text>
</svg>
