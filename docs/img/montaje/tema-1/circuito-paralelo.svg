<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 250" width="100%">
  <rect width="100%" height="100%" fill="#1e1e24" rx="8"/>
  
  <line x1="60" y1="110" x2="100" y2="110" stroke="#eceff1" stroke-width="2"/>
  <line x1="70" y1="130" x2="90" y2="130" stroke="#eceff1" stroke-width="4"/>
  <text x="25" y="125" fill="#eceff1" font-size="14" font-weight="bold" font-family="sans-serif">5 V</text>
  
  <path d="M 80 110 L 80 50 L 380 50" fill="none" stroke="#78909c" stroke-width="2"/>
  <path d="M 80 130 L 80 200 L 380 200" fill="none" stroke="#78909c" stroke-width="2"/>

  <!-- R1 -->
  <line x1="180" y1="50" x2="180" y2="90" stroke="#78909c" stroke-width="2"/>
  <rect x="170" y="90" width="20" height="70" fill="#262a36" stroke="#29b6f6" stroke-width="2"/>
  <line x1="180" y1="160" x2="180" y2="200" stroke="#78909c" stroke-width="2"/>
  <text x="160" y="120" fill="#fff" font-size="12" text-anchor="end" font-family="sans-serif">R1</text>
  <text x="160" y="135" fill="#eceff1" font-size="11" text-anchor="end" font-family="sans-serif">10 Ω</text>

  <!-- R2 -->
  <line x1="280" y1="50" x2="280" y2="90" stroke="#78909c" stroke-width="2"/>
  <rect x="270" y="90" width="20" height="70" fill="#262a36" stroke="#29b6f6" stroke-width="2"/>
  <line x1="280" y1="160" x2="280" y2="200" stroke="#78909c" stroke-width="2"/>
  <text x="260" y="120" fill="#fff" font-size="12" text-anchor="end" font-family="sans-serif">R2</text>
  <text x="260" y="135" fill="#eceff1" font-size="11" text-anchor="end" font-family="sans-serif">5 Ω</text>

  <!-- R3 -->
  <line x1="380" y1="50" x2="380" y2="90" stroke="#78909c" stroke-width="2"/>
  <rect x="370" y="90" width="20" height="70" fill="#262a36" stroke="#29b6f6" stroke-width="2"/>
  <line x1="380" y1="160" x2="380" y2="200" stroke="#78909c" stroke-width="2"/>
  <text x="400" y="120" fill="#fff" font-size="12" text-anchor="start" font-family="sans-serif">R3</text>
  <text x="400" y="135" fill="#eceff1" font-size="11" text-anchor="start" font-family="sans-serif">15 Ω</text>
</svg>
