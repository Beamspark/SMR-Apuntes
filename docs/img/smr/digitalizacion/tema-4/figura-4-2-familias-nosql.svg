<svg viewBox="0 0 940 380" width="100%" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#1e1e24" rx="10"/>

  <text x="470" y="38" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">MODELOS DE BASES DE DATOS NO CONVENCIONALES (NoSQL)</text>

  <g transform="translate(30, 70)">
    <rect x="0" y="0" width="165" height="260" rx="8" fill="#2d2d38" stroke="#29b6f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="165" height="40" rx="6" fill="#29b6f6"/>
    <text x="82" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Documentales</text>
    <text x="82" y="75" fill="#ab47bc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">JSON / BSON</text>
    <text x="82" y="110" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">Estructuras flexibles</text>
    <text x="82" y="128" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">y semiestructuradas.</text>
    <line x1="20" y1="160" x2="145" y2="160" stroke="#444444" stroke-width="1"/>
    <text x="82" y="190" fill="#29b6f6" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Ejemplos:</text>
    <text x="82" y="215" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">• MongoDB</text>
    <text x="82" y="235" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">• CouchDB</text>
  </g>

  <g transform="translate(210, 70)">
    <rect x="0" y="0" width="165" height="260" rx="8" fill="#2d2d38" stroke="#ab47bc" stroke-width="1.5"/>
    <rect x="0" y="0" width="165" height="40" rx="6" fill="#ab47bc"/>
    <text x="82" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Ancho de Columna</text>
    <text x="82" y="75" fill="#29b6f6" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">BigTable / Clúster</text>
    <text x="82" y="110" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">Escalabilidad horizontal</text>
    <text x="82" y="128" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">masiva distribuida.</text>
    <line x1="20" y1="160" x2="145" y2="160" stroke="#444444" stroke-width="1"/>
    <text x="82" y="190" fill="#ab47bc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Ejemplos:</text>
    <text x="82" y="215" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">• Apache Cassandra</text>
    <text x="82" y="235" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">• Apache HBase</text>
  </g>

  <g transform="translate(390, 70)">
    <rect x="0" y="0" width="165" height="260" rx="8" fill="#2d2d38" stroke="#29b6f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="165" height="40" rx="6" fill="#29b6f6"/>
    <text x="82" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Columnar Analytics</text>
    <text x="82" y="75" fill="#ab47bc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Data Warehouse</text>
    <text x="82" y="110" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">Lecturas masivas para</text>
    <text x="82" y="128" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">Business Intelligence.</text>
    <line x1="20" y1="160" x2="145" y2="160" stroke="#444444" stroke-width="1"/>
    <text x="82" y="190" fill="#29b6f6" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Ejemplos:</text>
    <text x="82" y="215" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">• Google BigQuery</text>
    <text x="82" y="235" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">• Amazon Redshift</text>
  </g>

  <g transform="translate(570, 70)">
    <rect x="0" y="0" width="165" height="260" rx="8" fill="#2d2d38" stroke="#ab47bc" stroke-width="1.5"/>
    <rect x="0" y="0" width="165" height="40" rx="6" fill="#ab47bc"/>
    <text x="82" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Grafos</text>
    <text x="82" y="75" fill="#29b6f6" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Nodos y Aristas</text>
    <text x="82" y="110" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">Relaciones complejas,</text>
    <text x="82" y="128" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">fraude y redes.</text>
    <line x1="20" y1="160" x2="145" y2="160" stroke="#444444" stroke-width="1"/>
    <text x="82" y="190" fill="#ab47bc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Ejemplos:</text>
    <text x="82" y="215" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">• Neo4j</text>
    <text x="82" y="235" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">• Amazon Neptune</text>
  </g>

  <g transform="translate(750, 70)">
    <rect x="0" y="0" width="160" height="260" rx="8" fill="#2d2d38" stroke="#29b6f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="160" height="40" rx="6" fill="#29b6f6"/>
    <text x="80" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">In-Memory</text>
    <text x="80" y="75" fill="#ab47bc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Caché en RAM</text>
    <text x="80" y="110" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">Latencia sub-milisegundo</text>
    <text x="80" y="128" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">y sesiones web.</text>
    <line x1="20" y1="160" x2="140" y2="160" stroke="#444444" stroke-width="1"/>
    <text x="80" y="190" fill="#29b6f6" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Ejemplos:</text>
    <text x="80" y="215" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">• Redis</text>
    <text x="80" y="235" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">• SAP HANA</text>
  </g>
</svg>
