<svg viewBox="0 0 950 340" width="100%" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#1e1e24" rx="10"/>

  <!-- TÍTULO SUPERIOR -->
  <text x="475" y="38" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">DIMENSIONES DEL DESARROLLO SOSTENIBLE (EQUILIBRIO DE PILARES)</text>

  <!-- ================= BALANZA 1: ECONÓMICA ================= -->
  <g transform="translate(40, 60)">
    <!-- Cabecera / Tarjeta Balanza 1 -->
    <rect x="0" y="0" width="260" height="230" rx="8" fill="#2d2d38" stroke="#29b6f6" stroke-width="1.5"/>
    <text x="130" y="30" fill="#29b6f6" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Sostenibilidad Económica</text>

    <!-- Estructura Balanza -->
    <!-- Base y Poste central -->
    <line x1="130" y1="45" x2="130" y2="175" stroke="#444444" stroke-width="4"/>
    <path d="M 105 180 L 155 180" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
    <circle cx="130" cy="55" r="5" fill="#29b6f6"/>

    <!-- Brazo horizontal -->
    <line x1="40" y1="65" x2="220" y2="65" stroke="#29b6f6" stroke-width="3"/>

    <!-- Plato Izquierdo -->
    <line x1="50" y1="65" x2="35" y2="110" stroke="#888888" stroke-width="1.5"/>
    <line x1="50" y1="65" x2="65" y2="110" stroke="#888888" stroke-width="1.5"/>
    <path d="M 25 110 Q 50 125 75 110 Z" fill="#29b6f6"/>
    <text x="50" y="145" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">Desarrollo</text>
    <text x="50" y="160" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">sostenible</text>

    <!-- Plato Derecho -->
    <line x1="210" y1="65" x2="195" y2="110" stroke="#888888" stroke-width="1.5"/>
    <line x1="210" y1="65" x2="225" y2="110" stroke="#888888" stroke-width="1.5"/>
    <path d="M 185 110 Q 210 125 235 110 Z" fill="#ab47bc"/>
    <text x="210" y="145" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">Crecimiento</text>
    <text x="210" y="160" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">económico</text>

    <!-- Etiqueta inferior -->
    <rect x="25" y="190" width="210" height="25" rx="4" fill="#1e1e24"/>
    <text x="130" y="207" fill="#888888" font-family="sans-serif" font-size="11" text-anchor="middle">Eficiencia y viabilidad</text>
  </g>

  <!-- ================= BALANZA 2: SOCIAL ================= -->
  <g transform="translate(345, 60)">
    <!-- Cabecera / Tarjeta Balanza 2 -->
    <rect x="0" y="0" width="260" height="230" rx="8" fill="#2d2d38" stroke="#ab47bc" stroke-width="1.5"/>
    <text x="130" y="30" fill="#ab47bc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Sostenibilidad Social</text>

    <!-- Estructura Balanza -->
    <!-- Base y Poste central -->
    <line x1="130" y1="45" x2="130" y2="175" stroke="#444444" stroke-width="4"/>
    <path d="M 105 180 L 155 180" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
    <circle cx="130" cy="55" r="5" fill="#ab47bc"/>

    <!-- Brazo horizontal -->
    <line x1="40" y1="65" x2="220" y2="65" stroke="#ab47bc" stroke-width="3"/>

    <!-- Plato Izquierdo -->
    <line x1="50" y1="65" x2="35" y2="110" stroke="#888888" stroke-width="1.5"/>
    <line x1="50" y1="65" x2="65" y2="110" stroke="#888888" stroke-width="1.5"/>
    <path d="M 25 110 Q 50 125 75 110 Z" fill="#29b6f6"/>
    <text x="50" y="145" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">Desarrollo</text>
    <text x="50" y="160" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">sostenible</text>

    <!-- Plato Derecho -->
    <line x1="210" y1="65" x2="195" y2="110" stroke="#888888" stroke-width="1.5"/>
    <line x1="210" y1="65" x2="225" y2="110" stroke="#888888" stroke-width="1.5"/>
    <path d="M 185 110 Q 210 125 235 110 Z" fill="#ab47bc"/>
    <text x="210" y="145" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">Inclusión</text>
    <text x="210" y="160" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">social</text>

    <!-- Etiqueta inferior -->
    <rect x="25" y="190" width="210" height="25" rx="4" fill="#1e1e24"/>
    <text x="130" y="207" fill="#888888" font-family="sans-serif" font-size="11" text-anchor="middle">Equidad y bienestar humano</text>
  </g>

  <!-- ================= BALANZA 3: AMBIENTAL ================= -->
  <g transform="translate(650, 60)">
    <!-- Cabecera / Tarjeta Balanza 3 -->
    <rect x="0" y="0" width="260" height="230" rx="8" fill="#2d2d38" stroke="#29b6f6" stroke-width="1.5"/>
    <text x="130" y="30" fill="#29b6f6" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Sostenibilidad Ambiental</text>

    <!-- Estructura Balanza -->
    <!-- Base y Poste central -->
    <line x1="130" y1="45" x2="130" y2="175" stroke="#444444" stroke-width="4"/>
    <path d="M 105 180 L 155 180" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
    <circle cx="130" cy="55" r="5" fill="#29b6f6"/>

    <!-- Brazo horizontal -->
    <line x1="40" y1="65" x2="220" y2="65" stroke="#29b6f6" stroke-width="3"/>

    <!-- Plato Izquierdo -->
    <line x1="50" y1="65" x2="35" y2="110" stroke="#888888" stroke-width="1.5"/>
    <line x1="50" y1="65" x2="65" y2="110" stroke="#888888" stroke-width="1.5"/>
    <path d="M 25 110 Q 50 125 75 110 Z" fill="#29b6f6"/>
    <text x="50" y="145" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">Desarrollo</text>
    <text x="50" y="160" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">sostenible</text>

    <!-- Plato Derecho -->
    <line x1="210" y1="65" x2="195" y2="110" stroke="#888888" stroke-width="1.5"/>
    <line x1="210" y1="65" x2="225" y2="110" stroke="#888888" stroke-width="1.5"/>
    <path d="M 185 110 Q 210 125 235 110 Z" fill="#ab47bc"/>
    <text x="210" y="145" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">Protección del</text>
    <text x="210" y="160" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">medio ambiente</text>

    <!-- Etiqueta inferior -->
    <rect x="25" y="190" width="210" height="25" rx="4" fill="#1e1e24"/>
    <text x="130" y="207" fill="#888888" font-family="sans-serif" font-size="11" text-anchor="middle">Preservación del entorno</text>
  </g>
</svg>
