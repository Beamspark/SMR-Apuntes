<svg viewBox="0 0 960 200" width="100%" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#1e1e24" rx="10"/>

  <defs>
    <marker id="arr-blue-5" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#29b6f6"/>
    </marker>
  </defs>

  <text x="480" y="32" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">FASES ESTRATÉGICAS DEL PLAN DE TRANSFORMACIÓN DIGITAL</text>

  <!-- Fase 1 -->
  <g transform="translate(25, 55)">
    <rect x="0" y="0" width="195" height="115" rx="8" fill="#2d2d38" stroke="#29b6f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="195" height="32" rx="6" fill="#29b6f6"/>
    <text x="97" y="21" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">FASE 1</text>
    <text x="97" y="58" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Evaluación y Análisis</text>
    <text x="97" y="80" fill="#888888" font-family="sans-serif" font-size="11" text-anchor="middle">Auditoría operativa</text>
    <text x="97" y="98" fill="#888888" font-family="sans-serif" font-size="11" text-anchor="middle">Detección de cuellos de botella</text>
  </g>

  <!-- Flecha 1 -->
  <line x1="225" y1="112" x2="255" y2="112" stroke="#29b6f6" stroke-width="3" marker-end="url(#arr-blue-5)"/>

  <!-- Fase 2 -->
  <g transform="translate(265, 55)">
    <rect x="0" y="0" width="195" height="115" rx="8" fill="#2d2d38" stroke="#ab47bc" stroke-width="1.5"/>
    <rect x="0" y="0" width="195" height="32" rx="6" fill="#ab47bc"/>
    <text x="97" y="21" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">FASE 2</text>
    <text x="97" y="58" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Objetivos y KPIs</text>
    <text x="97" y="80" fill="#888888" font-family="sans-serif" font-size="11" text-anchor="middle">Metas SMART</text>
    <text x="97" y="98" fill="#888888" font-family="sans-serif" font-size="11" text-anchor="middle">Indicadores de conversión</text>
  </g>

  <!-- Flecha 2 -->
  <line x1="465" y1="112" x2="495" y2="112" stroke="#29b6f6" stroke-width="3" marker-end="url(#arr-blue-5)"/>

  <!-- Fase 3 -->
  <g transform="translate(505, 55)">
    <rect x="0" y="0" width="195" height="115" rx="8" fill="#2d2d38" stroke="#29b6f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="195" height="32" rx="6" fill="#29b6f6"/>
    <text x="97" y="21" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">FASE 3</text>
    <text x="97" y="58" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Hoja de Ruta</text>
    <text x="97" y="80" fill="#888888" font-family="sans-serif" font-size="11" text-anchor="middle">Selección de software/Cloud</text>
    <text x="97" y="98" fill="#888888" font-family="sans-serif" font-size="11" text-anchor="middle">Cronograma y presupuesto</text>
  </g>

  <!-- Flecha 3 -->
  <line x1="705" y1="112" x2="735" y2="112" stroke="#29b6f6" stroke-width="3" marker-end="url(#arr-blue-5)"/>

  <!-- Fase 4 -->
  <g transform="translate(745, 55)">
    <rect x="0" y="0" width="190" height="115" rx="8" fill="#2d2d38" stroke="#ab47bc" stroke-width="1.5"/>
    <rect x="0" y="0" width="190" height="32" rx="6" fill="#ab47bc"/>
    <text x="95" y="21" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">FASE 4</text>
    <text x="95" y="58" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Implementación</text>
    <text x="95" y="80" fill="#888888" font-family="sans-serif" font-size="11" text-anchor="middle">Gestión cultural (Mindset)</text>
    <text x="95" y="98" fill="#888888" font-family="sans-serif" font-size="11" text-anchor="middle">Monitoreo y optimización</text>
  </g>
</svg>
