<svg viewBox="0 0 920 420" width="100%" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#1e1e24" rx="10"/>

  <!-- CABECERA -->
  <g transform="translate(30, 25)">
    <!-- Competencia -->
    <rect x="0" y="0" width="220" height="45" rx="6" fill="#29b6f6"/>
    <text x="110" y="28" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Competencia</text>

    <!-- Perfil exigible -->
    <rect x="230" y="0" width="200" height="45" rx="6" fill="#29b6f6"/>
    <text x="330" y="28" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Perfil exigible</text>

    <!-- Perfil disponible -->
    <rect x="440" y="0" width="200" height="45" rx="6" fill="#29b6f6"/>
    <text x="540" y="28" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Perfil disponible</text>

    <!-- Brecha -->
    <rect x="650" y="0" width="210" height="45" rx="6" fill="#ab47bc"/>
    <text x="755" y="28" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Brecha</text>
  </g>

  <!-- FILAS DE CONTENIDO -->
  <!-- Fila 1: Gestión agentes IA -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="220" height="65" rx="6" fill="#2d2d38" stroke="#29b6f6" stroke-width="1"/>
    <text x="110" y="30" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Conocimientos en</text>
    <text x="110" y="48" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">gestión agentes IA</text>

    <rect x="230" y="0" width="200" height="65" rx="6" fill="#2d2d38" stroke="#444444" stroke-width="1"/>
    <text x="330" y="38" fill="#ffffff" font-family="sans-serif" font-size="13" text-anchor="middle">Avanzado</text>

    <rect x="440" y="0" width="200" height="65" rx="6" fill="#2d2d38" stroke="#444444" stroke-width="1"/>
    <text x="540" y="38" fill="#ffffff" font-family="sans-serif" font-size="13" text-anchor="middle">Intermedio</text>

    <rect x="650" y="0" width="210" height="65" rx="6" fill="#2d2d38" stroke="#ab47bc" stroke-width="1"/>
    <text x="755" y="30" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">Necesita formación</text>
    <text x="755" y="48" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">adicional</text>
  </g>

  <!-- Fila 2: Habilidades técnicas -->
  <g transform="translate(30, 155)">
    <rect x="0" y="0" width="220" height="65" rx="6" fill="#2d2d38" stroke="#29b6f6" stroke-width="1"/>
    <text x="110" y="30" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Habilidades técnicas</text>
    <text x="110" y="48" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">(sistemas y redes)</text>

    <rect x="230" y="0" width="200" height="65" rx="6" fill="#2d2d38" stroke="#444444" stroke-width="1"/>
    <text x="330" y="38" fill="#ffffff" font-family="sans-serif" font-size="13" text-anchor="middle">Alto</text>

    <rect x="440" y="0" width="200" height="65" rx="6" fill="#2d2d38" stroke="#444444" stroke-width="1"/>
    <text x="540" y="38" fill="#ffffff" font-family="sans-serif" font-size="13" text-anchor="middle">Medio</text>

    <rect x="650" y="0" width="210" height="65" rx="6" fill="#2d2d38" stroke="#ab47bc" stroke-width="1"/>
    <text x="755" y="38" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">Prácticas adicionales</text>
  </g>

  <!-- Fila 3: Gestión del estrés -->
  <g transform="translate(30, 230)">
    <rect x="0" y="0" width="220" height="65" rx="6" fill="#2d2d38" stroke="#29b6f6" stroke-width="1"/>
    <text x="110" y="38" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Gestión del estrés</text>

    <rect x="230" y="0" width="200" height="65" rx="6" fill="#2d2d38" stroke="#444444" stroke-width="1"/>
    <text x="330" y="38" fill="#ffffff" font-family="sans-serif" font-size="13" text-anchor="middle">Alto</text>

    <rect x="440" y="0" width="200" height="65" rx="6" fill="#2d2d38" stroke="#444444" stroke-width="1"/>
    <text x="540" y="38" fill="#ffffff" font-family="sans-serif" font-size="13" text-anchor="middle">Alto</text>

    <rect x="650" y="0" width="210" height="65" rx="6" fill="#2d2d38" stroke="#444444" stroke-width="1"/>
    <text x="755" y="38" fill="#888888" font-family="sans-serif" font-size="13" text-anchor="middle">Ninguna</text>
  </g>

  <!-- Fila 4: Trabajo en equipo -->
  <g transform="translate(30, 305)">
    <rect x="0" y="0" width="220" height="65" rx="6" fill="#2d2d38" stroke="#29b6f6" stroke-width="1"/>
    <text x="110" y="38" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Trabajo en equipo</text>

    <rect x="230" y="0" width="200" height="65" rx="6" fill="#2d2d38" stroke="#444444" stroke-width="1"/>
    <text x="330" y="38" fill="#ffffff" font-family="sans-serif" font-size="13" text-anchor="middle">Alto</text>

    <rect x="440" y="0" width="200" height="65" rx="6" fill="#2d2d38" stroke="#444444" stroke-width="1"/>
    <text x="540" y="38" fill="#ffffff" font-family="sans-serif" font-size="13" text-anchor="middle">Alto</text>

    <rect x="650" y="0" width="210" height="65" rx="6" fill="#2d2d38" stroke="#444444" stroke-width="1"/>
    <text x="755" y="38" fill="#888888" font-family="sans-serif" font-size="13" text-anchor="middle">Ninguna</text>
  </g>
</svg>
