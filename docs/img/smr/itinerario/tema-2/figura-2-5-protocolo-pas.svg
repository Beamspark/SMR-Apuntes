<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 480" width="100%">
  <rect width="100%" height="100%" fill="#1e1e24" rx="10"/>
  <g transform="translate(25, 20)">
    <!-- Bloque P -->
    <rect x="200" y="0" width="200" height="35" fill="#29b6f6" rx="4"/>
    <text x="300" y="22" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">PROTEGER</text>
    <rect x="0" y="40" width="600" height="90" fill="#2d2d38" stroke="#29b6f6" stroke-width="1" rx="4"/>
    <text x="300" y="62" fill="#ffffff" font-size="10.5" font-family="sans-serif" text-anchor="middle">Asegurarnos de que el lugar del accidente no sea peligroso. No debemos prestar asistencia</text>
    <text x="300" y="78" fill="#ffffff" font-size="10.5" font-family="sans-serif" text-anchor="middle">hasta que el lugar sea seguro. Confirmar que no amenaza nuestra integridad ni la de la víctima.</text>
    <text x="300" y="94" fill="#ffffff" font-size="10.5" font-family="sans-serif" text-anchor="middle">Eliminar el origen del daño para evitar más heridas o complicaciones de las ya existentes.</text>

    <!-- Flecha 1 -->
    <path d="M 300 135 L 300 160" stroke="#29b6f6" stroke-width="3" fill="none"/>
    <polygon points="295,158 300,168 305,158" fill="#29b6f6"/>

    <!-- Bloque A -->
    <rect x="200" y="170" width="200" height="35" fill="#29b6f6" rx="4"/>
    <text x="300" y="192" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">AVISAR</text>
    <rect x="0" y="210" width="600" height="90" fill="#2d2d38" stroke="#29b6f6" stroke-width="1" rx="4"/>
    <text x="300" y="232" fill="#ffffff" font-size="10.5" font-family="sans-serif" text-anchor="middle">Pedir auxilio a los servicios de emergencias (112). La información debe ser clara, precisa y</text>
    <text x="300" y="248" fill="#ffffff" font-size="10.5" font-family="sans-serif" text-anchor="middle">contener la ubicación exacta, el número de heridos y una evaluación general de su estado.</text>
    <text x="300" y="264" fill="#ffffff" font-size="10.5" font-family="sans-serif" text-anchor="middle">Informar sobre posibles riesgos asociados (incendios, líquidos o gases tóxicos).</text>

    <!-- Flecha 2 -->
    <path d="M 300 305 L 300 330" stroke="#29b6f6" stroke-width="3" fill="none"/>
    <polygon points="295,328 300,338 305,328" fill="#29b6f6"/>

    <!-- Bloque S -->
    <rect x="200" y="340" width="200" height="35" fill="#ab47bc" rx="4"/>
    <text x="300" y="362" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">SOCORRER</text>
    <rect x="0" y="380" width="600" height="55" fill="#2d2d38" stroke="#ab47bc" stroke-width="1" rx="4"/>
    <text x="300" y="402" fill="#ffffff" font-size="10.5" font-family="sans-serif" text-anchor="middle">Identificar el estado de la víctima, estableciendo las medidas necesarias para mantener la respiración</text>
    <text x="300" y="418" fill="#ffffff" font-size="10.5" font-family="sans-serif" text-anchor="middle">y el pulso, iniciando si es preciso el protocolo de Soporte Vital Básico (SVB).</text>
  </g>
</svg>
