<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 220" width="100%">
  <rect width="100%" height="100%" fill="#1e1e24" rx="10"/>
  <g transform="translate(15, 15)">
    <!-- Paso 1 -->
    <rect x="10" y="10" width="180" height="170" fill="#2d2d38" stroke="#29b6f6" stroke-width="1" rx="6"/>
    <text x="25" y="35" fill="#fff176" font-size="22" font-weight="bold" font-family="sans-serif">1</text>
    <text x="100" y="80" fill="#ffffff" font-size="11" font-family="sans-serif" text-anchor="middle">Golpes interescapulares</text>
    <text x="100" y="100" fill="#29b6f6" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">5 Veces (5x)</text>
    <text x="100" y="130" fill="#888888" font-size="10" font-family="sans-serif" text-anchor="middle">Inclinado hacia delante</text>

    <!-- Paso 2 -->
    <rect x="210" y="10" width="180" height="170" fill="#2d2d38" stroke="#29b6f6" stroke-width="1" rx="6"/>
    <text x="225" y="35" fill="#fff176" font-size="22" font-weight="bold" font-family="sans-serif">2</text>
    <text x="300" y="80" fill="#ffffff" font-size="11" font-family="sans-serif" text-anchor="middle">Abrazar por detrás</text>
    <text x="300" y="100" fill="#ffffff" font-size="11" font-family="sans-serif" text-anchor="middle">Puño en la boca del estómago</text>
    <text x="300" y="130" fill="#888888" font-size="10" font-family="sans-serif" text-anchor="middle">(Por encima del ombligo)</text>

    <!-- Paso 3 -->
    <rect x="410" y="10" width="180" height="170" fill="#2d2d38" stroke="#ab47bc" stroke-width="1.5" rx="6"/>
    <text x="425" y="35" fill="#fff176" font-size="22" font-weight="bold" font-family="sans-serif">3</text>
    <text x="500" y="75" fill="#ffffff" font-size="11" font-family="sans-serif" text-anchor="middle">Comprensiones rápidas</text>
    <text x="500" y="95" fill="#ab47bc" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">Hacia dentro y arriba</text>
    <text x="500" y="125" fill="#ffffff" font-size="10" font-family="sans-serif" text-anchor="middle">Hasta expulsar cuerpo extraño</text>

    <!-- Pie de Figura -->
    <text x="300" y="198" fill="#ffffff" font-size="11" font-style="italic" font-family="sans-serif" text-anchor="middle">Secuencia de actuación en la Maniobra de Heimlich</text>
  </g>
</svg>
