<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 700" width="100%">
  <rect width="100%" height="100%" fill="#1e1e24" rx="12"/>

  <!-- Tabla 1: Datos de Entrada del Ejercicio -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="640" height="40" rx="6" fill="#ab47bc" fill-opacity="0.8"/>
    <line x1="210" y1="0" x2="210" y2="40" stroke="#1e1e24" stroke-width="2"/>
    <line x1="425" y1="0" x2="425" y2="40" stroke="#1e1e24" stroke-width="2"/>
    <text x="105" y="25" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">PROCESO</text>
    <text x="317" y="25" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">TIEMPO DE LLEGADA</text>
    <text x="532" y="25" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">TIEMPO DE EJECUCIÓN</text>

    <!-- Filas -->
    <rect x="0" y="40" width="640" height="140" fill="#2d2d38" stroke="#ab47bc" stroke-width="1"/>
    <path d="M 210 40 L 210 180 M 425 40 L 425 180" stroke="#ab47bc" stroke-width="1" stroke-dasharray="2,2"/>
    
    <text x="105" y="68" fill="#ffffff" font-size="13" font-family="sans-serif" text-anchor="middle">P1</text><text x="317" y="68" fill="#29b6f6" font-size="13" font-family="sans-serif" text-anchor="middle">0</text><text x="532" y="68" fill="#ffffff" font-size="13" font-family="sans-serif" text-anchor="middle">6</text><line x1="0" y1="75" x2="640" y2="75" stroke="#1e1e24"/>
    <text x="105" y="103" fill="#ffffff" font-size="13" font-family="sans-serif" text-anchor="middle">P2</text><text x="317" y="103" fill="#29b6f6" font-size="13" font-family="sans-serif" text-anchor="middle">3</text><text x="532" y="103" fill="#ffffff" font-size="13" font-family="sans-serif" text-anchor="middle">2</text><line x1="0" y1="110" x2="640" y2="110" stroke="#1e1e24"/>
    <text x="105" y="138" fill="#ffffff" font-size="13" font-family="sans-serif" text-anchor="middle">P3</text><text x="317" y="138" fill="#29b6f6" font-size="13" font-family="sans-serif" text-anchor="middle">4</text><text x="532" y="138" fill="#ffffff" font-size="13" font-family="sans-serif" text-anchor="middle">3</text><line x1="0" y1="145" x2="640" y2="145" stroke="#1e1e24"/>
    <text x="105" y="173" fill="#ffffff" font-size="13" font-family="sans-serif" text-anchor="middle">P4</text><text x="317" y="173" fill="#29b6f6" font-size="13" font-family="sans-serif" text-anchor="middle">6</text><text x="532" y="173" fill="#ffffff" font-size="13" font-family="sans-serif" text-anchor="middle">1</text>
  </g>

  <!-- Diagrama de Gantt -->
  <g transform="translate(40, 240)">
    <text x="0" y="0" fill="#ffffff" font-size="12" font-family="sans-serif">Diagrama de Gantt (Rojo = Ejecución CPU | Gris = Tiempo de espera)</text>

    <!-- Marcas de tiempo -->
    <g transform="translate(40, 155)" font-family="sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">
      <text x="0">0</text><text x="35">1</text><text x="70">2</text><text x="105">3</text><text x="140">4</text><text x="175">5</text><text x="210">6</text><text x="245">7</text><text x="280">8</text><text x="315">9</text><text x="350">10</text><text x="385">11</text><text x="420">12</text><text x="455">13</text>
    </g>

    <!-- Filas -->
    <text x="10" y="32" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif">P1</text><rect x="40" y="15" width="210" height="25" fill="#ab47bc" rx="2"/>
    <text x="10" y="62" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif">P2</text><rect x="145" y="45" width="105" height="25" fill="#555555" fill-opacity="0.5" rx="2"/><rect x="250" y="45" width="70" height="25" fill="#ab47bc" rx="2"/>
    <text x="10" y="92" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif">P3</text><rect x="180" y="75" width="140" height="25" fill="#555555" fill-opacity="0.5" rx="2"/><rect x="320" y="75" width="105" height="25" fill="#ab47bc" rx="2"/>
    <text x="10" y="122" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif">P4</text><rect x="250" y="105" width="175" height="25" fill="#555555" fill-opacity="0.5" rx="2"/><rect x="425" y="105" width="35" height="25" fill="#ab47bc" rx="2"/>

    <!-- Rejilla -->
    <path d="M 40 10 L 40 140 M 75 10 L 75 140 M 110 10 L 110 140 M 145 10 L 145 140 M 180 10 L 180 140 M 215 10 L 215 140 M 250 10 L 250 140 M 285 10 L 285 140 M 320 10 L 320 140 M 355 10 L 355 140 M 390 10 L 390 140 M 425 10 L 425 140 M 460 10 L 460 140 M 495 10 L 495 140" stroke="#444444" stroke-width="0.8" stroke-dasharray="2,2"/>
  </g>

  <!-- Tabla 2: Resultados Calculados -->
  <g transform="translate(40, 430)">
    <rect x="0" y="0" width="640" height="40" rx="6" fill="#ab47bc" fill-opacity="0.8"/>
    <line x1="100" y1="0" x2="100" y2="40" stroke="#1e1e24" stroke-width="1.5"/>
    <line x1="200" y1="0" x2="200" y2="40" stroke="#1e1e24" stroke-width="1.5"/>
    <line x1="310" y1="0" x2="310" y2="40" stroke="#1e1e24" stroke-width="1.5"/>
    <line x1="420" y1="0" x2="420" y2="40" stroke="#1e1e24" stroke-width="1.5"/>
    <line x1="530" y1="0" x2="530" y2="40" stroke="#1e1e24" stroke-width="1.5"/>
    <text x="50" y="25" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">PROCESO</text>
    <text x="150" y="20" fill="#ffffff" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">TIEMPO LLEGADA</text>
    <text x="255" y="20" fill="#ffffff" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">TIEMPO EJECUCIÓN</text>
    <text x="365" y="20" fill="#ffffff" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">TIEMPO FINALIZACIÓN</text>
    <text x="475" y="20" fill="#ffffff" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">TIEMPO RETORNO</text>
    <text x="585" y="20" fill="#ffffff" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">TIEMPO ESPERA</text>

    <!-- Filas de datos -->
    <rect x="0" y="40" width="640" height="180" fill="#2d2d38" stroke="#ab47bc" stroke-width="1"/>
    <path d="M 100 40 L 100 220 M 200 40 L 200 220 M 310 40 L 310 220 M 420 40 L 420 220 M 530 40 L 530 220" stroke="#ab47bc" stroke-width="1" stroke-dasharray="2,2"/>

    <text x="50" y="65" fill="#ffffff" font-size="12" font-family="sans-serif" text-anchor="middle">P1</text><text x="150" y="65" fill="#ffffff" font-size="12" font-family="sans-serif" text-anchor="middle">0</text><text x="255" y="65" fill="#ffffff" font-size="12" font-family="sans-serif" text-anchor="middle">6</text><text x="365" y="65" fill="#ffffff" font-size="12" font-family="sans-serif" text-anchor="middle">6</text><text x="475" y="65" fill="#ffffff" font-size="12" font-family="sans-serif" text-anchor="middle">6</text><text x="585" y="65" fill="#ffffff" font-size="12" font-family="sans-serif" text-anchor="middle">0</text><line x1="0" y1="75" x2="640" y2="75" stroke="#1e1e24"/>
    <text x="50" y="100" fill="#ffffff" font-size="12" font-family="sans-serif" text-anchor="middle">P2</text><text x="150" y="100" fill="#ffffff" font-size="12" font-family="sans-serif" text-anchor="middle">3</text><text x="255" y="100" fill="#ffffff" font-size="12" font-family="sans-serif" text-anchor="middle">2</text><text x="365" y="100" fill="#ffffff" font-size="12" font-family="sans-serif" text-anchor="middle">8</text><text x="475" y="100" fill="#ffffff" font-size="12" font-family="sans-serif" text-anchor="middle">5</text><text x="585" y="100" fill="#ffffff" font-size="12" font-family="sans-serif" text-anchor="middle">3</text><line x1="0" y1="110" x2="640" y2="110" stroke="#1e1e24"/>
    <text x="50" y="135" fill="#ffffff" font-size="12" font-family="sans-serif" text-anchor="middle">P3</text><text x="150" y="135" fill="#ffffff" font-size="12" font-family="sans-serif" text-anchor="middle">4</text><text x="255" y="135" fill="#ffffff" font-size="12" font-family="sans-serif" text-anchor="middle">3</text><text x="365" y="135" fill="#ffffff" font-size="12" font-family="sans-serif" text-anchor="middle">11</text><text x="475" y="135" fill="#ffffff" font-size="12" font-family="sans-serif" text-anchor="middle">7</text><text x="585" y="135" fill="#ffffff" font-size="12" font-family="sans-serif" text-anchor="middle">4</text><line x1="0" y1="145" x2="640" y2="145" stroke="#1e1e24"/>
    <text x="50" y="170" fill="#ffffff" font-size="12" font-family="sans-serif" text-anchor="middle">P4</text><text x="150" y="170" fill="#ffffff" font-size="12" font-family="sans-serif" text-anchor="middle">6</text><text x="255" y="170" fill="#ffffff" font-size="12" font-family="sans-serif" text-anchor="middle">1</text><text x="365" y="170" fill="#ffffff" font-size="12" font-family="sans-serif" text-anchor="middle">12</text><text x="475" y="170" fill="#ffffff" font-size="12" font-family="sans-serif" text-anchor="middle">6</text><text x="585" y="170" fill="#ffffff" font-size="12" font-family="sans-serif" text-anchor="middle">5</text><line x1="0" y1="180" x2="640" y2="180" stroke="#1e1e24"/>

    <!-- Fila Tiempos Medios Resaltada en Cian -->
    <rect x="0" y="180" width="640" height="40" fill="#29b6f6" fill-opacity="0.15"/>
    <text x="200" y="205" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">TIEMPOS MEDIOS</text>
    <text x="475" y="205" fill="#29b6f6" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">6</text>
    <text x="585" y="205" fill="#29b6f6" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">3</text>
  </g>
</svg>
