<svg viewBox="0 0 900 420" width="100%" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#1e1e24" rx="10"/>

  <!-- CABECERA -->
  <g transform="translate(30, 25)">
    <!-- Aspecto -->
    <rect x="0" y="0" width="190" height="45" rx="6" fill="#29b6f6"/>
    <text x="95" y="28" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Aspecto</text>

    <!-- Perfil disponible -->
    <rect x="200" y="0" width="210" height="45" rx="6" fill="#29b6f6"/>
    <text x="305" y="28" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Perfil disponible</text>

    <!-- Perfil exigible -->
    <rect x="420" y="0" width="210" height="45" rx="6" fill="#29b6f6"/>
    <text x="525" y="28" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Perfil exigible</text>

    <!-- Diferencia -->
    <rect x="640" y="0" width="200" height="45" rx="6" fill="#ab47bc"/>
    <text x="740" y="28" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Diferencia</text>
  </g>

  <!-- FILAS DE CONTENIDO -->
  <!-- Fila 1: Habilidades técnicas -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="190" height="65" rx="6" fill="#2d2d38" stroke="#29b6f6" stroke-width="1"/>
    <text x="95" y="38" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Habilidades técnicas</text>

    <rect x="200" y="0" width="210" height="65" rx="6" fill="#2d2d38" stroke="#444444" stroke-width="1"/>
    <text x="305" y="38" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">Conocimientos en X, Y, Z</text>

    <rect x="420" y="0" width="210" height="65" rx="6" fill="#2d2d38" stroke="#444444" stroke-width="1"/>
    <text x="525" y="38" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">Dominio en A, B, Z</text>

    <rect x="640" y="0" width="200" height="65" rx="6" fill="#2d2d38" stroke="#ab47bc" stroke-width="1"/>
    <text x="740" y="30" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">Falta de conocimientos</text>
    <text x="740" y="48" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">en A, B</text>
  </g>

  <!-- Fila 2: Habilidades generales -->
  <g transform="translate(30, 155)">
    <rect x="0" y="0" width="190" height="65" rx="6" fill="#2d2d38" stroke="#29b6f6" stroke-width="1"/>
    <text x="95" y="38" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Habilidades generales</text>

    <rect x="200" y="0" width="210" height="65" rx="6" fill="#2d2d38" stroke="#444444" stroke-width="1"/>
    <text x="305" y="30" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">Comunicación y</text>
    <text x="305" y="48" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">trabajo en equipo</text>

    <rect x="420" y="0" width="210" height="65" rx="6" fill="#2d2d38" stroke="#444444" stroke-width="1"/>
    <text x="525" y="30" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">Comunicación y</text>
    <text x="525" y="48" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">trabajo en equipo</text>

    <rect x="640" y="0" width="200" height="65" rx="6" fill="#2d2d38" stroke="#ab47bc" stroke-width="1"/>
    <text x="740" y="38" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">Desarrollo de liderazgo</text>
  </g>

  <!-- Fila 3: Experiencia laboral -->
  <g transform="translate(30, 230)">
    <rect x="0" y="0" width="190" height="65" rx="6" fill="#2d2d38" stroke="#29b6f6" stroke-width="1"/>
    <text x="95" y="38" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Experiencia laboral</text>

    <rect x="200" y="0" width="210" height="65" rx="6" fill="#2d2d38" stroke="#444444" stroke-width="1"/>
    <text x="305" y="38" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">2 años en el sector X</text>

    <rect x="420" y="0" width="210" height="65" rx="6" fill="#2d2d38" stroke="#444444" stroke-width="1"/>
    <text x="525" y="38" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">3-5 años en el sector X</text>

    <rect x="640" y="0" width="200" height="65" rx="6" fill="#2d2d38" stroke="#ab47bc" stroke-width="1"/>
    <text x="740" y="30" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">1-3 años adicionales</text>
    <text x="740" y="48" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">en el sector X</text>
  </g>

  <!-- Fila 4: Formación académica -->
  <g transform="translate(30, 305)">
    <rect x="0" y="0" width="190" height="65" rx="6" fill="#2d2d38" stroke="#29b6f6" stroke-width="1"/>
    <text x="95" y="38" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Formación académica</text>

    <rect x="200" y="0" width="210" height="65" rx="6" fill="#2d2d38" stroke="#444444" stroke-width="1"/>
    <text x="305" y="38" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">Grado en X</text>

    <rect x="420" y="0" width="210" height="65" rx="6" fill="#2d2d38" stroke="#444444" stroke-width="1"/>
    <text x="525" y="30" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">Grado en X +</text>
    <text x="525" y="48" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">certificación en Y</text>

    <rect x="640" y="0" width="200" height="65" rx="6" fill="#2d2d38" stroke="#ab47bc" stroke-width="1"/>
    <text x="740" y="38" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">Certificación en Y</text>
  </g>
</svg>
