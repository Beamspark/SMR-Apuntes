<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="100%">
  <rect width="100%" height="100%" fill="#1e1e24" rx="10"/>
  <g transform="translate(20, 20)">
    <!-- Columna Izquierda -->
    <!-- Organización -->
    <rect x="0" y="0" width="320" height="35" fill="#29b6f6" rx="4"/>
    <text x="160" y="22" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">Etapa de organización</text>
    <rect x="0" y="38" width="320" height="90" fill="#2d2d38" stroke="#29b6f6" stroke-width="1"/>
    <text x="160" y="58" fill="#ffffff" font-size="11" font-family="sans-serif" text-anchor="middle">Organización de los trabajadores.</text>
    <text x="160" y="75" fill="#ffffff" font-size="11" font-family="sans-serif" text-anchor="middle">Organización de la empresa.</text>
    <text x="160" y="92" fill="#ffffff" font-size="11" font-family="sans-serif" text-anchor="middle">Organización en caso de emergencia.</text>
    <text x="160" y="109" fill="#ffffff" font-size="11" font-family="sans-serif" text-anchor="middle">Organización mixta.</text>

    <!-- Control -->
    <rect x="0" y="145" width="320" height="35" fill="#29b6f6" rx="4"/>
    <text x="160" y="167" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">Etapa de control</text>
    <rect x="0" y="183" width="320" height="80" fill="#2d2d38" stroke="#29b6f6" stroke-width="1"/>
    <text x="160" y="208" fill="#ffffff" font-size="11" font-family="sans-serif" text-anchor="middle">Documentación.</text>
    <text x="160" y="228" fill="#ffffff" font-size="11" font-family="sans-serif" text-anchor="middle">Auditorías.</text>
    <text x="160" y="248" fill="#ffffff" font-size="11" font-family="sans-serif" text-anchor="middle">Lista de seguimiento de objetivos.</text>

    <!-- Planificación -->
    <rect x="0" y="280" width="320" height="35" fill="#29b6f6" rx="4"/>
    <text x="160" y="302" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">Etapa de planificación</text>
    <rect x="0" y="318" width="320" height="70" fill="#2d2d38" stroke="#29b6f6" stroke-width="1"/>
    <text x="160" y="345" fill="#ffffff" font-size="11" font-family="sans-serif" text-anchor="middle">Planificación de la actividad preventiva.</text>
    <text x="160" y="365" fill="#ffffff" font-size="11" font-family="sans-serif" text-anchor="middle">Evaluación de los riesgos.</text>

    <!-- Columna Derecha: Ejecución -->
    <rect x="350" y="0" width="330" height="35" fill="#ab47bc" rx="4"/>
    <text x="515" y="22" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">Etapa de ejecución</text>
    <rect x="350" y="38" width="330" height="350" fill="#2d2d38" stroke="#ab47bc" stroke-width="1"/>
    <text x="515" y="63" fill="#ffffff" font-size="11" font-family="sans-serif" text-anchor="middle">Información a los trabajadores.</text>
    <text x="515" y="91" fill="#ffffff" font-size="11" font-family="sans-serif" text-anchor="middle">Implantación de medidas preventivas.</text>
    <text x="515" y="119" fill="#ffffff" font-size="11" font-family="sans-serif" text-anchor="middle">Formación a los trabajadores.</text>
    <text x="515" y="147" fill="#ffffff" font-size="11" font-family="sans-serif" text-anchor="middle">Vigilancia médica de la salud.</text>
    <text x="515" y="175" fill="#ffffff" font-size="11" font-family="sans-serif" text-anchor="middle">Medidas de emergencia.</text>
    <text x="515" y="203" fill="#ffffff" font-size="11" font-family="sans-serif" text-anchor="middle">Protección de trabajadores sensibles.</text>
    <text x="515" y="231" fill="#ffffff" font-size="11" font-family="sans-serif" text-anchor="middle">Coordinación de actividades empresariales.</text>
    <text x="515" y="259" fill="#ffffff" font-size="11" font-family="sans-serif" text-anchor="middle">Relaciones de trabajo de duración determinada.</text>
    <text x="515" y="287" fill="#ffffff" font-size="11" font-family="sans-serif" text-anchor="middle">Equipos de trabajo y EPIs.</text>
    <text x="515" y="315" fill="#ffffff" font-size="11" font-family="sans-serif" text-anchor="middle">Plan de prevención.</text>
    <text x="515" y="343" fill="#ffffff" font-size="11" font-family="sans-serif" text-anchor="middle">Investigación de accidentes.</text>
  </g>
</svg>
