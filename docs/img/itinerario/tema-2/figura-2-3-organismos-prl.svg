<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 330" width="100%">
  <rect width="100%" height="100%" fill="#1e1e24" rx="10"/>
  <g transform="translate(25, 15)">
    <!-- Bloque 1 -->
    <rect x="0" y="10" width="600" height="45" fill="#2d2d38" stroke="#29b6f6" stroke-width="1.5" rx="5"/>
    <text x="300" y="37" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">Organización Internacional del Trabajo (OIT)</text>

    <!-- Bloque 2 -->
    <rect x="0" y="70" width="600" height="45" fill="#2d2d38" stroke="#29b6f6" stroke-width="1.5" rx="5"/>
    <text x="300" y="97" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">Agencia Europea para la Seguridad y Salud en el Trabajo (EU-OSHA)</text>

    <!-- Bloque 3 -->
    <rect x="0" y="130" width="600" height="45" fill="#2d2d38" stroke="#ab47bc" stroke-width="1.5" rx="5"/>
    <text x="300" y="157" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">Comisión Nacional de Seguridad y Salud en el Trabajo (CNSST)</text>

    <!-- Bloque 4 -->
    <rect x="0" y="190" width="600" height="45" fill="#2d2d38" stroke="#ab47bc" stroke-width="1.5" rx="5"/>
    <text x="300" y="217" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">Instituto Nacional de Seguridad y Salud en el Trabajo (INSST)</text>

    <!-- Bloque 5 -->
    <rect x="0" y="250" width="600" height="45" fill="#2d2d38" stroke="#ab47bc" stroke-width="1.5" rx="5"/>
    <text x="300" y="277" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">Inspección del Trabajo y Seguridad Social (ITSS)</text>
  </g>
</svg>
