<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="100%">
  <rect width="100%" height="100%" fill="#1e1e24" rx="10"/>

  <g transform="translate(30, 20)">
    <!-- Cabecera Principal -->
    <rect x="0" y="0" width="620" height="45" rx="6" fill="#29b6f6" fill-opacity="0.8"/>
    <text x="310" y="28" fill="#ffffff" font-size="15" font-weight="bold" font-family="sans-serif" text-anchor="middle">Medidas de apoyo a la innovación</text>

    <!-- Subcabecera -->
    <g transform="translate(0, 45)">
      <rect x="0" y="0" width="310" height="35" fill="#2d2d38" stroke="#29b6f6" stroke-width="1"/>
      <rect x="310" y="0" width="310" height="35" fill="#2d2d38" stroke="#29b6f6" stroke-width="1"/>
      <text x="155" y="22" fill="#29b6f6" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">Económicas</text>
      <text x="465" y="22" fill="#29b6f6" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">No económicas</text>
    </g>

    <!-- Filas de Datos -->
    <g transform="translate(0, 80)">
      <!-- Fila 1 -->
      <rect x="0" y="0" width="310" height="45" fill="#1e1e24" stroke="#444444" stroke-width="0.8"/>
      <rect x="310" y="0" width="310" height="45" fill="#1e1e24" stroke="#444444" stroke-width="0.8"/>
      <text x="155" y="27" fill="#ffffff" font-size="12" font-family="sans-serif" text-anchor="middle">Premios en metálico</text>
      <text x="465" y="27" fill="#ffffff" font-size="12" font-family="sans-serif" text-anchor="middle">Información</text>

      <!-- Fila 2 -->
      <rect x="0" y="45" width="310" height="45" fill="#2d2d38" stroke="#444444" stroke-width="0.8"/>
      <rect x="310" y="45" width="310" height="45" fill="#2d2d38" stroke="#444444" stroke-width="0.8"/>
      <text x="155" y="72" fill="#ffffff" font-size="12" font-family="sans-serif" text-anchor="middle">Bonificaciones fiscales</text>
      <text x="465" y="72" fill="#ffffff" font-size="12" font-family="sans-serif" text-anchor="middle">Asesoramiento</text>

      <!-- Fila 3 -->
      <rect x="0" y="90" width="310" height="45" fill="#1e1e24" stroke="#444444" stroke-width="0.8"/>
      <rect x="310" y="90" width="310" height="45" fill="#1e1e24" stroke="#444444" stroke-width="0.8"/>
      <text x="155" y="117" fill="#ffffff" font-size="12" font-family="sans-serif" text-anchor="middle">Financiación</text>
      <text x="465" y="117" fill="#ffffff" font-size="12" font-family="sans-serif" text-anchor="middle">Formación</text>

      <!-- Fila 4 -->
      <rect x="0" y="135" width="310" height="45" fill="#2d2d38" stroke="#444444" stroke-width="0.8"/>
      <rect x="310" y="135" width="310" height="45" fill="#2d2d38" stroke="#444444" stroke-width="0.8"/>
      <text x="155" y="162" fill="#ffffff" font-size="12" font-family="sans-serif" text-anchor="middle">Subvenciones</text>
      <text x="465" y="162" fill="#ffffff" font-size="12" font-family="sans-serif" text-anchor="middle">Seguimiento</text>

      <!-- Fila 5 -->
      <rect x="0" y="180" width="310" height="45" fill="#1e1e24" stroke="#444444" stroke-width="0.8"/>
      <rect x="310" y="180" width="310" height="45" fill="#1e1e24" stroke="#444444" stroke-width="0.8"/>
      <text x="155" y="207" fill="#888888" font-size="12" font-family="sans-serif" text-anchor="middle">—</text>
      <text x="465" y="207" fill="#ffffff" font-size="12" font-family="sans-serif" text-anchor="middle">Facilitar locales o herramientas</text>
    </g>
  </g>
</svg>
