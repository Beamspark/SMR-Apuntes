<svg viewBox="0 0 850 440" width="100%" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#1e1e24" rx="10"/>

  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#29b6f6"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ab47bc"/>
    </marker>
  </defs>

  <!-- COLUMNA IZQUIERDA: ECONOMÍA LINEAL -->
  <g transform="translate(30, 25)">
    <!-- Cabecera Lineal -->
    <rect x="0" y="0" width="360" height="45" rx="6" fill="#2d2d38" stroke="#444444" stroke-width="1.5"/>
    <text x="180" y="28" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">ECONOMÍA LINEAL</text>

    <!-- Paso 1: Extracción -->
    <rect x="40" y="70" width="280" height="45" rx="6" fill="#2d2d38" stroke="#444444" stroke-width="1.5"/>
    <text x="180" y="98" fill="#ffffff" font-family="sans-serif" font-size="13" text-anchor="middle">1. Extracción de materias primas</text>

    <line x1="180" y1="115" x2="180" y2="145" stroke="#29b6f6" stroke-width="2" marker-end="url(#arr-blue)"/>

    <!-- Paso 2: Producción -->
    <rect x="40" y="150" width="280" height="45" rx="6" fill="#2d2d38" stroke="#444444" stroke-width="1.5"/>
    <text x="180" y="178" fill="#ffffff" font-family="sans-serif" font-size="13" text-anchor="middle">2. Fabricación del producto</text>

    <line x1="180" y1="195" x2="180" y2="225" stroke="#29b6f6" stroke-width="2" marker-end="url(#arr-blue)"/>

    <!-- Paso 3: Consumo -->
    <rect x="40" y="230" width="280" height="45" rx="6" fill="#2d2d38" stroke="#444444" stroke-width="1.5"/>
    <text x="180" y="258" fill="#ffffff" font-family="sans-serif" font-size="13" text-anchor="middle">3. Consumo y uso único</text>

    <line x1="180" y1="275" x2="180" y2="305" stroke="#29b6f6" stroke-width="2" marker-end="url(#arr-blue)"/>

    <!-- Paso 4: Vertedero -->
    <rect x="40" y="310" width="280" height="45" rx="6" fill="#2d2d38" stroke="#ff5252" stroke-width="1.5"/>
    <text x="180" y="338" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">4. Desecho / Vertedero (Residuo)</text>
  </g>

  <!-- LÍNEA SEPARADORA VERTICAL -->
  <line x1="425" y1="30" x2="425" y2="400" stroke="#33333e" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- COLUMNA DERECHA: ECONOMÍA CIRCULAR -->
  <g transform="translate(460, 25)">
    <!-- Cabecera Circular -->
    <rect x="0" y="0" width="360" height="45" rx="6" fill="#2d2d38" stroke="#ab47bc" stroke-width="2"/>
    <text x="180" y="28" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">ECONOMÍA CIRCULAR</text>

    <!-- Paso 1: Ecodiseño -->
    <rect x="40" y="70" width="280" height="45" rx="6" fill="#2d2d38" stroke="#ab47bc" stroke-width="1.5"/>
    <text x="180" y="98" fill="#ffffff" font-family="sans-serif" font-size="13" text-anchor="middle">1. Ecodiseño y materias recicladas</text>

    <line x1="180" y1="115" x2="180" y2="145" stroke="#ab47bc" stroke-width="2" marker-end="url(#arr-purple)"/>

    <!-- Paso 2: Producción limpia -->
    <rect x="40" y="150" width="280" height="45" rx="6" fill="#2d2d38" stroke="#ab47bc" stroke-width="1.5"/>
    <text x="180" y="178" fill="#ffffff" font-family="sans-serif" font-size="13" text-anchor="middle">2. Fabricación sostenible / Remanufactura</text>

    <line x1="180" y1="195" x2="180" y2="225" stroke="#ab47bc" stroke-width="2" marker-end="url(#arr-purple)"/>

    <!-- Paso 3: Uso y reparación -->
    <rect x="40" y="230" width="280" height="45" rx="6" fill="#2d2d38" stroke="#29b6f6" stroke-width="1.5"/>
    <text x="180" y="258" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">3. Uso, reparación y reutilización</text>

    <line x1="180" y1="275" x2="180" y2="305" stroke="#ab47bc" stroke-width="2" marker-end="url(#arr-purple)"/>

    <!-- Paso 4: Recogida y reciclaje -->
    <rect x="40" y="310" width="280" height="45" rx="6" fill="#2d2d38" stroke="#ab47bc" stroke-width="1.5"/>
    <text x="180" y="338" fill="#ffffff" font-family="sans-serif" font-size="13" text-anchor="middle">4. Recogida selectiva y reciclado</text>

    <!-- Curva de retorno circular -->
    <path d="M 40 332 C -10 332 -10 92 35 92" stroke="#29b6f6" stroke-width="2" fill="none" marker-end="url(#arr-blue)"/>
    <text x="5" y="215" fill="#29b6f6" font-family="sans-serif" font-size="11" font-weight="bold" transform="rotate(-90 5 215)" text-anchor="middle">Reincorporación al ciclo</text>
  </g>
</svg>
