<svg viewBox="0 0 880 440" width="100%" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#1e1e24" rx="10"/>

  <text x="440" y="38" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">ARQUITECTURA DE CÓMPUTO DISTRIBUIDO: DE LA NUBE AL DISPOSITIVO</text>

  <!-- Capa 1: Cloud -->
  <g transform="translate(40, 60)">
    <rect x="0" y="0" width="580" height="70" rx="8" fill="#2d2d38" stroke="#ab47bc" stroke-width="2"/>
    <text x="30" y="32" fill="#ab47bc" font-family="sans-serif" font-size="15" font-weight="bold">☁️ Cloud Computing (Nube)</text>
    <text x="30" y="52" fill="#ffffff" font-family="sans-serif" font-size="12">Centros de datos globales • Big Data masivo • Almacenamiento a largo plazo</text>
  </g>

  <!-- Capa 2: Fog -->
  <g transform="translate(40, 145)">
    <rect x="0" y="0" width="580" height="70" rx="8" fill="#2d2d38" stroke="#29b6f6" stroke-width="2"/>
    <text x="30" y="32" fill="#29b6f6" font-family="sans-serif" font-size="15" font-weight="bold">🌫️ Fog Computing (Niebla)</text>
    <text x="30" y="52" fill="#ffffff" font-family="sans-serif" font-size="12">Nodos de red locales • Routers industriales y switches • Coordinación zonal</text>
  </g>

  <!-- Capa 3: Edge -->
  <g transform="translate(40, 230)">
    <rect x="0" y="0" width="580" height="70" rx="8" fill="#2d2d38" stroke="#ab47bc" stroke-width="2"/>
    <text x="30" y="32" fill="#ab47bc" font-family="sans-serif" font-size="15" font-weight="bold">⚡ Edge Computing (Borde)</text>
    <text x="30" y="52" fill="#ffffff" font-family="sans-serif" font-size="12">Gateways en planta • Servidores locales • Baja latencia en tiempo real</text>
  </g>

  <!-- Capa 4: Mist -->
  <g transform="translate(40, 315)">
    <rect x="0" y="0" width="580" height="70" rx="8" fill="#2d2d38" stroke="#29b6f6" stroke-width="2"/>
    <text x="30" y="32" fill="#29b6f6" font-family="sans-serif" font-size="15" font-weight="bold">💧 Mist Computing (Neblina / Micro-borde)</text>
    <text x="30" y="52" fill="#ffffff" font-family="sans-serif" font-size="12">Microcontroladores finales • Sensores inteligentes • IA empotrada (TinyML)</text>
  </g>

  <!-- Flechas e indicadores laterales -->
  <!-- Flecha Latencia -->
  <g transform="translate(660, 60)">
    <line x1="40" y1="20" x2="40" y2="310" stroke="#29b6f6" stroke-width="3"/>
    <polygon points="40,325 33,310 47,310" fill="#29b6f6"/>
    <text x="60" y="170" fill="#29b6f6" font-family="sans-serif" font-size="12" font-weight="bold">Menor</text>
    <text x="60" y="188" fill="#29b6f6" font-family="sans-serif" font-size="12" font-weight="bold">Latencia</text>
  </g>

  <!-- Flecha Capacidad de Cómputo -->
  <g transform="translate(770, 60)">
    <line x1="40" y1="310" x2="40" y2="20" stroke="#ab47bc" stroke-width="3"/>
    <polygon points="40,5 33,20 47,20" fill="#ab47bc"/>
    <text x="60" y="170" fill="#ab47bc" font-family="sans-serif" font-size="12" font-weight="bold">Mayor</text>
    <text x="60" y="188" fill="#ab47bc" font-family="sans-serif" font-size="12" font-weight="bold">Capacidad</text>
  </g>
</svg>
