<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%">
  <rect width="100%" height="100%" fill="#1e1e24" rx="12"/>

  <text x="40" y="35" fill="#ffffff" font-size="16" font-weight="bold" font-family="sans-serif">Memoria RAM (bloques de tamaño variable)</text>

  <!-- Lado Izquierdo: Bloques de RAM -->
  <g transform="translate(40, 55)">
    <!-- Bloque 1 -->
    <rect x="0" y="0" width="120" height="45" rx="4" fill="#ab47bc" fill-opacity="0.6" stroke="#ab47bc" stroke-width="1.5"/>
    <text x="60" y="20" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Proceso A</text>
    <text x="60" y="35" fill="#ffffff" font-size="11" font-family="sans-serif" text-anchor="middle">20 MB</text>
    <text x="135" y="20" fill="#ffffff" font-size="11" font-family="sans-serif">Bloque ocupado</text>
    <text x="135" y="35" fill="#ffffff" font-size="11" font-family="sans-serif">(no disponible)</text>

    <!-- Hueco 1 -->
    <rect x="0" y="55" width="120" height="40" rx="4" fill="#29b6f6" fill-opacity="0.4" stroke="#29b6f6" stroke-width="1.5"/>
    <text x="60" y="72" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Libre 10 MB</text>
    <text x="135" y="72" fill="#29b6f6" font-size="11" font-weight="bold" font-family="sans-serif">Hueco libre: 10 MB (insuficiente)</text>

    <!-- Bloque 2 -->
    <rect x="0" y="105" width="120" height="55" rx="4" fill="#ab47bc" fill-opacity="0.6" stroke="#ab47bc" stroke-width="1.5"/>
    <text x="60" y="128" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Proceso B</text>
    <text x="60" y="143" fill="#ffffff" font-size="11" font-family="sans-serif" text-anchor="middle">30 MB</text>
    <text x="135" y="128" fill="#ffffff" font-size="11" font-family="sans-serif">Bloque ocupado</text>
    <text x="135" y="143" fill="#ffffff" font-size="11" font-family="sans-serif">(no disponible)</text>

    <!-- Hueco 2 -->
    <rect x="0" y="170" width="120" height="50" rx="4" fill="#29b6f6" fill-opacity="0.4" stroke="#29b6f6" stroke-width="1.5"/>
    <text x="60" y="192" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Libre 15 MB</text>
    <text x="135" y="192" fill="#29b6f6" font-size="11" font-weight="bold" font-family="sans-serif">Hueco libre: 15 MB (insuficiente)</text>

    <!-- Bloque 3 -->
    <rect x="0" y="230" width="120" height="50" rx="4" fill="#ab47bc" fill-opacity="0.6" stroke="#ab47bc" stroke-width="1.5"/>
    <text x="60" y="252" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Proceso C</text>
    <text x="60" y="267" fill="#ffffff" font-size="11" font-family="sans-serif" text-anchor="middle">25 MB</text>
    <text x="135" y="252" fill="#ffffff" font-size="11" font-family="sans-serif">Bloque ocupado</text>
    <text x="135" y="267" fill="#ffffff" font-size="11" font-family="sans-serif">(no disponible)</text>
  </g>

  <!-- Lado Derecho: Cuadro de Resumen -->
  <g transform="translate(450, 55)">
    <rect x="0" y="0" width="230" height="280" rx="6" fill="#2d2d38" stroke="#ab47bc" stroke-width="1.5"/>
    <text x="15" y="25" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif">RESUMEN</text>
    
    <text x="15" y="50" fill="#ffffff" font-size="11" font-family="sans-serif">• Memoria libre total: <tspan font-weight="bold">25 MB</tspan></text>
    <text x="15" y="70" fill="#ffffff" font-size="11" font-family="sans-serif">• Programa a cargar: <tspan font-weight="bold">20 MB</tspan></text>
    <text x="15" y="90" fill="#ffffff" font-size="11" font-family="sans-serif">• Huecos libres disponibles:</text>
    <text x="25" y="110" fill="#ffffff" font-size="11" font-family="sans-serif">- 10 MB</text>
    <text x="25" y="125" fill="#ffffff" font-size="11" font-family="sans-serif">- 15 MB</text>

    <line x1="15" y1="145" x2="215" y2="145" stroke="#ab47bc" stroke-width="1"/>

    <text x="15" y="170" fill="#ffb74d" font-size="11" font-weight="bold" font-family="sans-serif">• Resultado:</text>
    <text x="15" y="190" fill="#ffb74d" font-size="11" font-weight="bold" font-family="sans-serif">NO se puede cargar</text>
    <text x="15" y="208" fill="#ffffff" font-size="10" font-family="sans-serif">porque no existe un único</text>
    <text x="15" y="223" fill="#ffffff" font-size="10" font-family="sans-serif">bloque continuo libre</text>
    <text x="15" y="238" fill="#ffffff" font-size="10" font-family="sans-serif">de 20 MB.</text>
  </g>
</svg>
