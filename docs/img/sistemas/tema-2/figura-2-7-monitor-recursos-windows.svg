<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%">
  <rect width="100%" height="100%" fill="#1e1e24" rx="10"/>

  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="680" height="360" rx="6" fill="#ffffff" stroke="#ab47bc" stroke-width="1.5"/>
    
    <!-- Cabecera -->
    <rect x="0" y="0" width="680" height="25" fill="#f0f0f0"/>
    <text x="15" y="17" fill="#333333" font-size="11" font-family="sans-serif">Monitor de recursos</text>

    <!-- Menú Pestañas -->
    <rect x="0" y="25" width="680" height="25" fill="#fcfcfc" stroke="#e0e0e0"/>
    <text x="15" y="42" fill="#333333" font-size="11" font-family="sans-serif">Información general</text>
    <rect x="120" y="25" width="50" height="25" fill="#0078d4" fill-opacity="0.1"/>
    <text x="135" y="42" fill="#0078d4" font-size="11" font-weight="bold" font-family="sans-serif">CPU</text>
    <text x="180" y="42" fill="#333333" font-size="11" font-family="sans-serif">Memoria</text>
    <text x="235" y="42" fill="#333333" font-size="11" font-family="sans-serif">Disco</text>
    <text x="280" y="42" fill="#333333" font-size="11" font-family="sans-serif">Red</text>

    <!-- Área de Contenido de Procesos -->
    <g transform="translate(10, 60)">
      <rect x="0" y="0" width="460" height="280" fill="#ffffff" stroke="#cccccc"/>
      <rect x="0" y="0" width="460" height="20" fill="#f0f0f0"/>
      <text x="10" y="14" fill="#333333" font-size="10" font-weight="bold" font-family="sans-serif">Proceso</text>
      <text x="160" y="14" fill="#333333" font-size="10" font-weight="bold" font-family="sans-serif">PID</text>
      <text x="220" y="14" fill="#333333" font-size="10" font-weight="bold" font-family="sans-serif">Estado</text>
      <text x="320" y="14" fill="#333333" font-size="10" font-weight="bold" font-family="sans-serif">CPU %</text>

      <!-- Filas de datos -->
      <text x="10" y="35" fill="#0056b3" font-size="10" font-family="sans-serif">backgroundTaskHost.exe</text><text x="160" y="35" fill="#333333" font-size="10" font-family="sans-serif">7120</text><text x="220" y="35" fill="#333333" font-size="10" font-family="sans-serif">Suspendido</text><text x="320" y="35" fill="#333333" font-size="10" font-family="sans-serif">0.69</text>
      <text x="10" y="55" fill="#0056b3" font-size="10" font-family="sans-serif">SearchApp.exe</text><text x="160" y="55" fill="#333333" font-size="10" font-family="sans-serif">4992</text><text x="220" y="55" fill="#333333" font-size="10" font-family="sans-serif">Suspendido</text><text x="320" y="55" fill="#333333" font-size="10" font-family="sans-serif">0.08</text>
      <text x="10" y="75" fill="#0056b3" font-size="10" font-family="sans-serif">VirtualBoxVM.exe</text><text x="160" y="75" fill="#333333" font-size="10" font-family="sans-serif">6160</text><text x="220" y="75" fill="#333333" font-size="10" font-family="sans-serif">En ejecución</text><text x="320" y="75" fill="#333333" font-size="10" font-weight="bold" font-family="sans-serif">12.4</text>
      <text x="10" y="95" fill="#0056b3" font-size="10" font-family="sans-serif">dwm.exe</text><text x="160" y="95" fill="#333333" font-size="10" font-family="sans-serif">412</text><text x="220" y="95" fill="#333333" font-size="10" font-family="sans-serif">En ejecución</text><text x="320" y="95" fill="#333333" font-size="10" font-family="sans-serif">1.33</text>
    </g>

    <!-- Gráfica de Rendimiento en Tiempo Real (Verde) -->
    <g transform="translate(480, 60)">
      <rect x="0" y="0" width="190" height="280" fill="#000000" stroke="#cccccc"/>
      <text x="10" y="20" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif">CPU (Uso 14%)</text>
      
      <!-- Rejilla verde -->
      <path d="M 10 30 L 180 30 M 10 70 L 180 70 M 10 110 L 180 110 M 10 150 L 180 150" stroke="#004d00" stroke-width="1"/>
      
      <!-- Línea de rendimiento verde en tiempo real -->
      <path d="M 10 140 L 30 135 L 50 142 L 70 80 L 80 110 L 100 60 L 120 120 L 140 100 L 160 130 L 180 90" fill="none" stroke="#00ff00" stroke-width="1.5"/>
    </g>
  </g>
</svg>
