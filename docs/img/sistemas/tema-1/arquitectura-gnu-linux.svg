<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%">
  <rect width="100%" height="100%" fill="#1e1e24" rx="12"/>

  <!-- Capa 4: Aplicaciones (Exterior) -->
  <circle cx="300" cy="300" r="260" fill="#ab47bc" fill-opacity="0.08" stroke="#ab47bc" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="300" y="85" fill="#ffffff" font-size="16" font-weight="bold" font-family="sans-serif" text-anchor="middle">Aplicaciones</text>

  <!-- Capa 3: Aplicaciones base (GNU) -->
  <circle cx="300" cy="300" r="210" fill="#ab47bc" fill-opacity="0.2" stroke="#ab47bc" stroke-width="1.5"/>
  <text x="300" y="445" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">Aplicaciones base (GNU)</text>

  <!-- Cuñato / Sector: Shell CLI -->
  <path d="M 210 470 A 210 210 0 0 0 390 470 L 350 435 A 160 160 0 0 1 250 435 Z" fill="#29b6f6" fill-opacity="0.35" stroke="#29b6f6" stroke-width="1.5"/>
  <text x="300" y="485" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">Shell CLI</text>

  <!-- Capa 2: Kernel (Linux) -->
  <circle cx="300" cy="300" r="140" fill="#ab47bc" fill-opacity="0.4" stroke="#ab47bc" stroke-width="2"/>
  <text x="300" y="390" fill="#ffffff" font-size="15" font-weight="bold" font-family="sans-serif" text-anchor="middle">Kernel (Linux)</text>

  <!-- Cuña / Sector: Biblioteca de funciones (glibc) -->
  <path d="M 170 340 A 140 140 0 0 1 255 165 L 280 230 A 70 70 0 0 0 235 320 Z" fill="#29b6f6" fill-opacity="0.45" stroke="#29b6f6" stroke-width="1.5"/>
  <text x="200" y="240" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif" transform="rotate(-60 200 240)" text-anchor="middle">Biblioteca de funciones</text>

  <!-- Capa 1: Hardware (Centro) -->
  <circle cx="300" cy="300" r="70" fill="#29b6f6" fill-opacity="0.6" stroke="#29b6f6" stroke-width="2"/>
  <text x="300" y="305" fill="#ffffff" font-size="15" font-weight="bold" font-family="sans-serif" text-anchor="middle">Hardware</text>
</svg>
