site_name: Cuaderno Técnico SMR - Luis
site_description: Apuntes y documentación técnica del Grado Medio en Sistemas Microinformáticos y Redes.
site_author: Luis

theme:
  name: material
  palette:
    scheme: slate
    primary: deep purple
    accent: purple
  features:
    - navigation.tabs
    - navigation.indexes
    - content.code.copy

markdown_extensions:
  - abbr
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.arithmatex:
      generic: true
  - md_in_html
  - admonition
  - pymdownx.details

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - 🏠 Inicio: index.md
  - 💻 Semestre 1:
      - 🛠️ Montaje y Mantenimiento de Equipos:
          - montaje/index.md
          - Tema 1 - Medición de Parámetros Eléctricos: montaje/tema-1.md
          - Tema 2 - Prevención de Riesgos Laborales: montaje/tema-2.md
          - Tema 3 - Bloques Funcionales del PC: montaje/tema-3.md
          - Tema 4 - Precauciones y Seguridad: montaje/tema-4.md
          - Tema 5 - Herramientas Necesarias: montaje/tema-5.md
          - Tema 6 - Análisis de Mercado de Componentes: montaje/tema-6.md
          - Tema 7 - Procedimientos de Montaje: montaje/tema-7.md
          - Tema 8 - Puesta en Marcha del Equipo: montaje/tema-8.md
          - Tema 9 - Nuevas Tendencias: montaje/tema-9.md
          - Tema 10 - Mantenimiento Preventivo y Correctivo: montaje/tema-10.md
          - Tema 11 - Instalación de Programas y Software: montaje/tema-11.md
      - 💻 Sistemas Operativos Monopuesto:
          - sistemas/index.md
          - Tema 1 - Caracterización de los Sistemas Operativos: sistemas/tema-1.md
          - Tema 2 - Máquinas virtuales: sistemas/tema-2.md
          - Tema 3 - Instalación de sistemas operativos libres y propietarios: sistemas/tema-3.md
          - Tema 4 - Configuración de sistemas operativos libres y propietarios: sistemas/tema-4.md
          - Tema 5 - Administración de sistemas operativos libres y propietarios: sistemas/tema-5.md
      - Digitalización Aplicada a los Sectores Productivos: digitalizacion/index.md
      - 💼 Itinerario Personal para la Empleabilidad I (IPE I):
          - itinerario/index.md
          - Tema 1 - Sector productivo: itinerario/tema-1.md
          - Tema 2 - Prevención de riesgos laborales: itinerario/tema-2.md
          - Tema 3 - Condiciones laborales: itinerario/tema-3.md
          - Tema 4 - Autoorientación e inserción: itinerario/tema-4.md
          - Tema 5 - Aprendizaje autónomo: itinerario/tema-5.md
