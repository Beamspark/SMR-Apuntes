site_name: Cuaderno Técnico CFGM SMR - Luis
site_description: Apuntes y documentación técnica del Ciclo Formativo de Grado Medio en Sistemas Microinformáticos y Redes.
site_author: Luis

theme:
  name: material
  palette:
    scheme: slate
    primary: deep purple
    accent: purple
  features:
    - navigation.tabs
    - navigation.indexes
    - content.code.copy

markdown_extensions:
  - abbr
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.arithmatex:
      generic: true
  - md_in_html
  - admonition
  - pymdownx.details

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/extra.js

