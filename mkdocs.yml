site_name: Cuaderno Técnico SMR - Luis
site_description: Apuntes y documentación técnica del Grado Medio en Sistemas Microinformáticos y Redes.
site_author: Luis

theme:
  name: material
  palette:
    scheme: slate
    primary: deep purple
    accent: purple
  features:
    - navigation.tabs
    - navigation.indexes
    - content.code.copy

markdown_extensions:
  - abbr
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.arithmatex:
      generic: true
  - md_in_html
  - admonition
  - pymdownx.details

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/extra.js

nav:
  - 🏠 Inicio: index.md
  - 💻 Semestre 1:
      - 🛠️ Montaje y Mantenimiento de Equipos:
          - smr/montaje/index.md
          - Tema 1 - Medición de parámetros eléctricos: smr/montaje/tema-1.md
          - Tema 2 - Prevención de riesgos laborales: smr/montaje/tema-2.md
          - Tema 3 - Bloques funcionales del PC: smr/montaje/tema-3.md
          - Tema 4 - Precauciones y seguridad: smr/montaje/tema-4.md
          - Tema 5 - Herramientas necesarias: smr/montaje/tema-5.md
          - Tema 6 - Análisis de mercado de componentes: smr/montaje/tema-6.md
          - Tema 7 - Procedimientos de montaje: smr/montaje/tema-7.md
          - Tema 8 - Puesta en marcha del equipo: smr/montaje/tema-8.md
          - Tema 9 - Nuevas tendencias: smr/montaje/tema-9.md
          - Tema 10 - Mantenimiento preventivo y correctivo: smr/montaje/tema-10.md
          - Tema 11 - Instalación de programas y software: smr/montaje/tema-11.md
      - 💻 Sistemas Operativos Monopuesto:
